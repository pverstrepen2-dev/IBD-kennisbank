async function buildKnowledgeIndex(){

    const records =
        await getKnowledgeData();

    if(!Array.isArray(records)){

        console.error(
            "Geen knowledgeData gevonden",
            records
        );

        return;
    }

    const existingKeys =
        new Set(

            globalIndex

            .filter(
                item =>
                    item.source === "knowledge"
            )

            .map(
                item =>
                    `knowledge_${
                        item.id
                    }`
            )

        );

    let addedCount = 0;

    let skippedCount = 0;

    records.forEach(record => {

        const recordId =

            record.id ||

            (
                record.title || ""
            )
            .toLowerCase()
            .trim();

        const uniqueKey =
            `knowledge_${recordId}`;

        if(
            existingKeys.has(
                uniqueKey
            )
        ){

            skippedCount++;

            return;
        }

        existingKeys.add(
            uniqueKey
        );

        const item = {

            source : "knowledge",

            id :
                record.id ||
                Date.now() +
                Math.random(),

            title :
                record.title ||
                "Naamloos document",

            description :
                record.description ||
                "",

            mainCategory :
                record.mainCategory ||
                "Overig",

            subCategory :
                record.subCategory ||
                "Algemeen",

            category :
                record.mainCategory ||
                record.category ||
                "Overig",

            tags :

                Array.isArray(
                    record.tags
                )

                ? record.tags

                : [],

            relationships :

                Array.isArray(
                    record.relationships
                )

                ? record.relationships

                : [],

            language :
                record.language ||
                "NL",

            audience :
                record.audience ||
                "Iedereen",

            type :
                record.type ||
                "artikel",

            fileName :
                record.fileName ||
                "",

            oneDriveId :
                record.oneDriveId ||
                "",

            author :
                record.author ||
                "",

            status :
                record.status ||
                "Actief",

            created :
                record.created ||
                "",

            modified :
                record.modified ||
                "",

            semanticScore :

                (
                    Array.isArray(
                        record.tags
                    )

                    ? record.tags.length

                    : 0
                )

                +

                (
                    Array.isArray(
                        record.relationships
                    )

                    ? record.relationships.length

                    : 0
                ),

            content : "",

            data : record

        globalIndex.push(

async function scanDriveFolder(
    token,
    folderId,
    path = "",
    visitedFolders = new Set()
){

    if(visitedFolders.has(folderId)){

        console.warn(
            "Map reeds verwerkt:",
            folderId
        );

        return [];
    }

    visitedFolders.add(folderId);

    let results = [];

    try{

        let nextUrl =

            `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children?$top=999`;

        while(nextUrl){

            const response =
                await fetch(
                    nextUrl,
                    {
                        headers:{
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );

            if(!response.ok){

                console.error(
                    "Graph fout:",
                    response.status,
                    nextUrl
                );

                break;
            }

            const data =
                await response.json();

            const items =
                data.value || [];

            console.log(
                "Pagina geladen:",
                items.length,
                "items"
            );

            for(const item of items){

                const currentPath =

                    path

                    ? `${path}/${item.name}`

                    : item.name;

                const normalizedItem = {

                    id :
                        item.id,

                    name :
                        item.name,

                    fullPath :
                        currentPath,

                    webUrl :
                        item.webUrl || "",

                    size :
                        item.size || 0,

                    folder :
                        item.folder || null,

                    file :
                        item.file || null,

                    package :
                        item.package || null,

                    remoteItem :
                        item.remoteItem || null,

                    shared :
                        item.shared || null,

                    createdDateTime :
                        item.createdDateTime || "",

                    lastModifiedDateTime :
                        item.lastModifiedDateTime || ""

                };

                results.push(
                    normalizedItem
                );

                if(item.folder){

                    try{

                        const childItems =

                            await scanDriveFolder(

                                token,

                                item.id,

                                currentPath,

                                visitedFolders

                            );

                        results.push(
                            ...childItems
                        );

                    }
                    catch(error){

                        console.error(

                            "Submap fout:",

                            currentPath,

                            error

                        );

                    }

                }

            }

            nextUrl =
                data["@odata.nextLink"] || null;

            if(nextUrl){

                console.log(
                    "➡ Volgende pagina..."
                );

            }

        }

        console.log({

            totaal: results.length,

            folders:
                results.filter(
                    x => x.folder
                ).length,

            files:
                results.filter(
                    x => !x.folder
                ).length,

            shared:
                results.filter(
                    x => x.shared
                ).length,

            remote:
                results.filter(
                    x => x.remoteItem
                ).length

        });

        console.log(
            "SCAN VOLTOOID:",
            path,
            results.length
        );

        return results;

    }
    catch(error){

        console.error(
            "scanDriveFolder fout:",
            error
        );

        return results;
    }

}

async function getFolderByPath(
    folderName
){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/children",

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const data =
        await response.json();

    const rootFolder =

        (data.value || []).find(

            item =>

                item.folder &&

                item.name === "CCV-VZW"

        );

    if(
        !rootFolder
    ){

        console.error(
            "CCV-VZW niet gevonden"
        );

        return null;

    }

    const childrenResponse =
        await fetch(

            `https://graph.microsoft.com/v1.0/me/drive/items/${rootFolder.id}/children`,

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const childrenData =
        await childrenResponse.json();

    const targetFolder =

        (childrenData.value || []).find(

            item =>

                item.folder &&

                item.name === folderName

        );

    return targetFolder || null;

}

function determineLibraryType(
    path
){

    const p =
        (path || "")
        .toLowerCase();

    if(
        p.includes(
            "/kennisbank/"
        )
    ){
        return "knowledge";
    }

    if(
        p.includes(
            "/documenten/"
        )
    ){
        return "knowledge";
    }

    if(
        p.includes(
            "/ledenbeheer/"
        )
    ){
        return "members";
    }

    if(
        p.includes(
            "/projecten/"
        )
    ){
        return "projects";
    }

    if(
        p.includes(
            "/vergaderingen/"
        )
    ){
        return "meetings";
    }

    if(
        p.includes(
            "/onkosten/"
        )
    ){
        return "finance";
    }

    if(
        p.includes(
            "/kasboek/"
        )
    ){
        return "finance";
    }

    if(
        p.includes(
            "/admin_ccv/"
        )
    ){
        return "administration";
    }

    return "general";

}

function buildDocumentSignature(item){

    return (

        (item.name || "")
        .toLowerCase()
        .trim()

        +

        "|"

        +

        (item.size || 0)

}

function chooseNewestVersion(items){

    if(items.length <= 1){

        return items[0];

    }

    return items.sort(

        (a,b)=>

            new Date(
                b.lastModifiedDateTime || 0
            )

            -

            new Date(
                a.lastModifiedDateTime || 0
            )

    )[0];

}

async function buildOneDriveIndex(){

    console.log(
        "Start volledige OneDrive scan..."
    );

    const token =
        await getAccessToken();

    const kennisbankFolder =
        await getFolderByPath(
            "Kennisbank"
        );

    const documentenFolder =
        await getFolderByPath(
            "Documenten"
        );

    let allItems = [];

    if(kennisbankFolder){

        console.log(
            "SCAN KENNISBANK:",
            kennisbankFolder.id
        );

        allItems.push(

            ...(await scanDriveFolder(

                token,
                kennisbankFolder.id,
                "CCV-VZW/Kennisbank"

            ))

        );

    }

    if(documentenFolder){

        console.log(
            "SCAN DOCUMENTEN:",
            documentenFolder.id
        );

        allItems.push(

            ...(await scanDriveFolder(

                token,
                documentenFolder.id,
                "CCV-VZW/Documenten"

            ))

        );

    }

    console.log(
        "TOTAAL GESCAND:",
        allItems.length
    );

    /* ======================================
       VERSIEDETECTIE
       ====================================== */

    if(
        IndexSettings.keepLatestVersionOnly
    ){

        const groups = {};

        allItems.forEach(item=>{

            if(item.folder){

                return;
            }

            const signature =
                buildDocumentSignature(
                    item
                );

            if(
                !groups[signature]
            ){

                groups[signature] = [];

            }

            groups[signature].push(
                item
            );

        });

        let filteredItems = [];

        let keptVersions = 0;
        let removedVersions = 0;

        Object.values(groups)
        .forEach(group=>{

            if(group.length === 1){

                filteredItems.push(
                    group[0]
                );

                return;
            }

            const newest =

                chooseNewestVersion(
                    group
                );

            filteredItems.push(
                newest
            );

            keptVersions++;

            console.group(
                "VERSIEGROEP"
            );

            console.log(
                "✅ BEHOUDEN:"
            );

            console.log({

                naam:
                    newest.name,

                modified:
                    newest.lastModifiedDateTime,

                size:
                    newest.size,

                pad:
                    newest.fullPath

            });

            group
            .filter(
                item =>
                    item !== newest
            )
            .forEach(oldVersion=>{

                removedVersions++;

                console.log(
                    "❌ UITGEFILTERD:"
                );

                console.log({

                    naam:
                        oldVersion.name,

                    modified:
                        oldVersion.lastModifiedDateTime,

                    size:
                        oldVersion.size,

                    pad:
                        oldVersion.fullPath

                });

            });

            console.groupEnd();

        });

        const folders =

            allItems.filter(
                x => x.folder
            );

        allItems = [

            ...folders,

            ...filteredItems

        ];

        console.log(
            "VERSIEGROEPEN:",
            keptVersions
        );

        console.log(
            "UITGEFILTERDE VERSIES:",
            removedVersions
        );

        console.log(
            "NA VERSIEFILTER:",
            allItems.length
        );

    }

    /* ======================================
       DEDUPLICATIE
       ====================================== */

    const existingIds =
        new Set();

    const existingFiles =
        new Set();

    let indexedFiles = 0;
    let indexedFolders = 0;
    let duplicateIds = 0;
    let duplicateFiles = 0;

    allItems.forEach(item=>{

        const source =

            item.folder
                ? "folder"
                : "file";

        const idKey =

            source +
            "_" +
            item.id;

        const fileKey =

            (
                item.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                item.size || 0
            )

            +

            "|"

            +

            (
                item.lastModifiedDateTime || ""
            );

        if(
            existingIds.has(
                idKey
            )
        ){

            duplicateIds++;

            return;

        }

        if(
            source === "file"
            &&
            existingFiles.has(
                fileKey
            )
        ){

            duplicateFiles++;

            console.log(

                "DUBBEL BESTAND:",

                item.name,

                item.fullPath

            );

            return;

        }

        existingIds.add(
            idKey
        );

        if(source === "file"){

            existingFiles.add(
                fileKey
            );

        }

        globalIndex.push({

            source:
                source,

            libraryType:
                determineLibraryType(
                    item.fullPath
                ),

            managementCategory:
                determineManagementCategory(
                    item.fullPath
                ),

            managementSubCategory:
                determineManagementSubCategory(
                    item.fullPath
                ),

            id:
                item.id,

            title:
                item.name || "",

            location:
                item.fullPath || "",

            modified:
                item.lastModifiedDateTime || "",

            size:
                item.size || 0,

            webUrl:
                item.webUrl || "",

            fileType:
                item.file?.mimeType || "",

            shared:
                !!item.shared,

            remote:
                !!item.remoteItem,

            tags:[],

            relationships:[],

            content:"",

            data:item

        });

        if(source === "file"){

            indexedFiles++;

        }
        else{

            indexedFolders++;

        }

    });

    console.log(
        "FILES GEINDEXEERD:",
        indexedFiles
    );

    console.log(
        "FOLDERS GEINDEXEERD:",
        indexedFolders
    );

    console.log(
        "DUBBELE ID'S:",
        duplicateIds
    );

    console.log(
        "DUBBELE BESTANDEN:",
        duplicateFiles
    );

    console.log(
        "GLOBALINDEX TOTAAL:",
        globalIndex.length
    );

    console.log(
        "BRONOVERZICHT:",
        globalIndex.reduce(

            (acc,item)=>{

                acc[item.source] =
                    (acc[item.source] || 0) + 1;

                return acc;

            },

            {}

        )

    );

}

async function extractPdfContent(fileId){

    try{

        const token =
            await getAccessToken();

        const response =
            await fetch(

                `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`,

                {

                    headers:{

                        Authorization:
                            "Bearer " + token

                    }

                }

            );
        if(!response.ok){

    console.warn(
        "PDF niet leesbaar:",
        fileId,
        response.status
    );

    return "";

}

        const buffer =
            await response.arrayBuffer();

        const pdf =

            await pdfjsLib
            .getDocument({

                data:buffer

            })
            .promise;

        let text = "";

        for(

            let pageNumber = 1;

            pageNumber <= pdf.numPages;

            pageNumber++

        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );

            const content =
                await page.getTextContent();

            text +=

                content.items

                .map(
                    item => item.str
                )

                .join(" ");

        }

        return text;

    }
    catch(error){

        console.error(
            "PDF extract fout",
            error
        );

        return "";

    }

}

function runSearch(){

    const searchBox =
        document.getElementById(
            "globalSearch"
        );

    const filterBox =
        document.getElementById(
            "searchFilter"
        );

    if(
        !searchBox ||
        !filterBox
    ){
        return;
    }

    const term =
        searchBox.value
        .trim()
        .toLowerCase();

    const filter =
        filterBox.value;

    let results =
        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                item =>
                    item.source === filter
            );

    }

    results.sort((a,b)=>{

        const aTitle =
            (a.title || "")
            .toLowerCase();

        const bTitle =
            (b.title || "")
            .toLowerCase();

        return aTitle.localeCompare(
            bTitle
        );

    });

    renderResults(results);

}

function determineManagementCategory(
    path
){

    const p =
        (path || "")
        .toLowerCase();

    if(
        p.includes(
            "/ledenbeheer/"
        )
    ){
        return "members";
    }

    if(
        p.includes(
            "/projecten/"
        )
    ){
        return "projects";
    }

    if(
        p.includes(
            "/vergaderingen/"
        )
    ){
        return "meetings";
    }

    if(
        p.includes(
            "/kasboek/"
        )
    ){
        return "finance";
    }

    if(
        p.includes(
            "/onkosten/"
        )
    ){
        return "finance";
    }

    if(
        p.includes(
            "/post_verzendingen/"
        )
    ){
        return "shipping";
    }

    if(
        p.includes(
            "/admin_ccv/"
        )
    ){
        return "administration";
    }

    return "";

}

function determineManagementSubCategory(
    path
){

    const parts =
        (path || "")
        .split("/");

    const baseFolders = [

        "ledenbeheer",
        "projecten",
        "vergaderingen",
        "onkosten",
        "kasboek",
        "admin_ccv",
        "post_verzendingen"

    ];

    const matchIndex =

        parts.findIndex(

            part =>

                baseFolders.includes(
                    part.toLowerCase()
                )

        );

    if(
        matchIndex >= 0 &&

        parts.length >
        matchIndex + 1
    ){

        return parts[
            matchIndex + 1
        ];

    }

    return "Algemeen";

}

function buildSemanticRelations(){

    const processedPairs = new Set();

    globalIndex.forEach(item=>{

        item.relationships = [];

    });

    globalIndex.forEach(item=>{

        const tempRelations = [];

        globalIndex.forEach(other=>{

            const sourceId =
                item.source + "_" + item.id;

            const targetId =
                other.source + "_" + other.id;

            /* Zelfde item overslaan */

            if(sourceId === targetId){
                return;
            }

            /* Dubbele combinaties voorkomen */

            const pairKey =
                [sourceId,targetId]
                .sort()
                .join("|");

            if(
                processedPairs.has(
                    pairKey
                )
            ){
                return;
            }

            processedPairs.add(
                pairKey
            );

            /* Alleen Knowledge en Website */

            if(
                (
                    item.source !== "knowledge" &&
                    item.source !== "website"
                )
                ||
                (
                    other.source !== "knowledge" &&
                    other.source !== "website"
                )
            ){
                return;
            }

            const similarity =
                calculateSimilarity(
                    item,
                    other
                );

            const semanticScore =
                calculateContentSimilarity(
                    item,
                    other
                );

            /* Strengere filter */

            const totalScore =
                similarity * 5 +
                semanticScore;

            if(totalScore < 20){
                return;
            }

            tempRelations.push({

                id:other.id,

                source:other.source,

                type:"related",

                automatic:true,

                weight:totalScore

            });

        });

        /* Enkel sterkste relaties bewaren */

        item.relationships =

            tempRelations

            .sort(
                (a,b)=>
                    b.weight - a.weight
            )

            .slice(0,10);

    });

    console.log(
        "Semantische relaties opgebouwd"
    );

}

function buildDocumentConnections(){

    console.log(
    "DocumentConnections:",
    documentConnections
);

    documentConnections = [];

    const existingConnections = new Set();

    globalIndex.forEach(item=>{

        globalIndex.forEach(other=>{

            const sourceId =
                item.source + "_" + item.id;

            const targetId =
                other.source + "_" + other.id;

            /* Zelfde document */

            if(sourceId === targetId){
                return;
            }

            /* Eén richting */

            if(sourceId > targetId){
                return;
            }

            /* Duplicaten vermijden */

            const connectionKey =
                [sourceId,targetId]
                .sort()
                .join("|");

            if(
                existingConnections.has(
                    connectionKey
                )
            ){
                return;
            }

            const score =
                calculateContentSimilarity(
                    item,
                    other
                );

            /* Veel strenger filter */

          if(
    score <
    minimumRelationScore
){
    return;
}

            existingConnections.add(
                connectionKey
            );

            documentConnections.push({

                source:sourceId,

                target:targetId,

                score:score,

                automatic:true

            });

        });

    });

    /* Sterkste relaties eerst */

    documentConnections.sort(
        (a,b)=>b.score-a.score
    );

    /* Veiligheidslimiet */

    documentConnections =
        documentConnections.slice(
            0,
            1000
        );

    console.log(
        "Document connecties:",
        documentConnections.length
    );

}

async function buildKnowledgeNetwork(){

    if(!globalIndex.length){

        document.getElementById(
            "knowledgeDetails"
        ).innerHTML =
            "Geen gegevens gevonden";

        return;

    }

    buildConceptClusters();

await buildDocumentKeywordIndex();

buildSemanticRelations();

buildDocumentConnections();

    const nodes = [];
    const edges = [];
    const edgeSet = new Set();

    globalIndex.forEach(item=>{

        const nodeId =
            item.source +
            "_" +
            item.id;

        if(
            !nodes.some(
                n => n.id === nodeId
            )
        ){

            nodes.push({

                id:nodeId,

                label:
                    item.title ||
                    item.name ||
                    String(item.id),

                group:item.source,

                value:
                    calculateSemanticScore(
                        item
                    )

            });

        }

        (item.relationships || []).forEach(rel=>{

                            x.source +

                        )
                        ===
                        String(rel.id)

            if(!targetItem){

            }

            const edgeKey =

                [
                    nodeId,
                    targetItem.source +
                    "_" +
                    targetItem.id
                ]

                .sort()

                .join("|");

            if(!edgeSet.has(edgeKey)){

                edgeSet.add(edgeKey);

                edges.push({

                    from:nodeId,

                    to:

function createManualRelation(

    sourceNode,

    targetNode

){

    if(
        sourceNode === targetNode
    ){

        return;

    }

    const sourceParts =
        sourceNode.split("_");

    const sourceType =
        sourceParts[0];

    const sourceId =
        sourceParts.slice(1).join("_");

    const sourceItem =

        globalIndex.find(

            item =>

                item.source === sourceType &&

                String(item.id)
                ===
                String(sourceId)

        );

    if(!sourceItem){

        return;

    }

    if(
        !sourceItem.relationships
    ){

        sourceItem.relationships = [];

    }

    sourceItem.relationships.push({

        id:targetNode,

        type:"manual",

        created:
            new Date()
            .toISOString()

    });

    buildKnowledgeNetwork();

};

function calculateSimilarity(
    item,
    other
){

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    return tags1.filter(

        tag =>

            tags2.includes(tag)

    ).length;

}

function calculateContentSimilarity(
    item,
    other
){

    let score = 0;

    const text1 = `

    ${item.title || ""}
    ${item.description || ""}
    ${item.category || ""}
    ${item.content || ""}
    ${normalizeTags(item.tags).join(" ")}

`
.toLowerCase();

const text2 = `

    ${other.title || ""}
    ${other.description || ""}
    ${other.category || ""}
    ${other.content || ""}
    ${normalizeTags(other.tags).join(" ")}

`
.toLowerCase();

    const words1 =

    text1
    .split(/\s+/)
    .filter(Boolean);

const words2 =

    text2
    .split(/\s+/)
    .filter(Boolean);

words1.forEach(word=>{

    if(
        word.length > 2 &&
        words2.includes(word)
    ){

        score++;

    }

});

const key1 =

    documentKeywordIndex[
        item.source +
        "_" +
        item.id
    ] || [];

const key2 =

    documentKeywordIndex[
        other.source +
        "_" +
        other.id
    ] || [];

key1.forEach(keyword=>{

    if(
        key2.includes(keyword)
    ){

        score += 2;

    }

});

    return score;

}

function buildConceptClusters(){

    KnowledgeHub.concepts = [

        "Crohn",
        "Colitis",
        "Voeding",
        "Medicatie",
        "Onderzoek",
        "Werk",
        "Rechten",
        "Psychologie",
        "Jongeren",
        "Stoma"

    ];

}

function normalizeTags(tags){

    if(!tags){

        return [];

    }

    if(Array.isArray(tags)){

        return tags
        .map(x=>x.toLowerCase().trim())
        .filter(Boolean);

    }

    return String(tags)

        .split(",")

        .map(x=>x.toLowerCase().trim())

        .filter(Boolean);

}

function globalSearch(term){

    if(!term){

        return globalIndex;
    }

    term =
        term.toLowerCase().trim();

    return globalIndex.filter(item => {

        const searchable = `

            ${item.title || ""}
            ${item.category || ""}
            ${item.description || ""}
            ${item.location || ""}
            ${item.country || ""}
            ${item.fileType || ""}
            ${normalizeTags(item.tags)
                .join(" ")}

        `
        .toLowerCase();

        const words =
            term.split(/\s+/);

        return words.every(
            word =>
                searchable.includes(word)
        );

    });

}

function calculateSemanticScore(item){

    let score = 1;

    score += normalizeTags(
        item.tags
    ).length;

    score +=
        item.relationships
            ? item.relationships.length
            : 0;

    if(item.description){

        score += 2;

    }

    return score;

}

function focusConcept(tag){

    const nodeIds = [];

    globalIndex
.filter(item=>

    item.source === "knowledge" ||

    item.source === "website"

)
.forEach(item=>{

        const tags =

            normalizeTags(
                item.tags
            );

        if(

            tags.includes(

                tag.toLowerCase()

            )

        ){

            nodeIds.push(

                item.source +
                "_" +
                item.id

            );

        }

    });

    if(!nodeIds.length){

        return;

    }

    knowledgeNetwork.selectNodes(
        nodeIds
    );

    knowledgeNetwork.fit({

        nodes:nodeIds,

        animation:true

    });

}

function searchKnowledgeNode(){

    const term =

        document
        .getElementById(
            "knowledgeSearch"
        )
        .value
        .toLowerCase()
        .trim();

    if(!term){

        return;

    }

    const node =

        globalIndex.find(item=>

            JSON.stringify(item)

            .toLowerCase()

            .includes(term)

        );

    if(!node){

        return;

    }

    const nodeId =

        node.source +
        "_" +
        node.id;

    knowledgeNetwork.focus(

        nodeId,

        {

            scale:1.5,

            animation:true

        }

    );

    knowledgeNetwork.selectNodes(
        [nodeId]
    );

    showKnowledgeExplorer(
        nodeId
    );

}
