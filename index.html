<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CCV-VZW Kennisplatform V3.1</title>

<script src="https://unpkg.com/@azure/msal-browser@latest/lib/msal-browser.min.js"></script>

<style>

:root{

    --sidebar:#1f2937;
    --bg:#f5f7fb;
    --card:#ffffff;
    --primary:#2563eb;
    --text:#111827;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;

}

body{

    background:var(--bg);

}

.app{

    display:flex;
    height:100vh;

}

.sidebar{

    width:260px;
    background:var(--sidebar);
    color:white;
    padding:20px;

}

.logo{

    font-size:24px;
    font-weight:600;
    margin-bottom:30px;

}

.menu-button{

    display:block;

    width:100%;

    margin-bottom:10px;

    padding:12px;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

.main{

    flex:1;

    display:flex;

    flex-direction:column;

}

.topbar{

    background:white;

    border-bottom:1px solid #ddd;

    padding:15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.content{

    flex:1;

    padding:25px;

    overflow:auto;

}

.card{

    background:white;

    border-radius:12px;

    padding:20px;

    box-shadow:0 2px 10px rgba(0,0,0,.05);

}

.page-title{

    font-size:28px;

    font-weight:600;

    margin-bottom:20px;

}

.action-btn{

    padding:10px 15px;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

</style>

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            📚 CCV-VZW Kennisplatform V3.1

        </div>

        <button
            class="menu-button"
            onclick="renderDashboard()"
        >
            🏠 Dashboard
        </button>

        <button
            class="menu-button"
            onclick="openOneDrive()"
        >
            ☁ OneDrive
        </button>

        <button
            class="menu-button"
            onclick="renderUsers()"
        >
            👤 Gebruikers
        </button>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>

                <button
                    id="loginBtn"
                    class="action-btn"
                    onclick="loginMicrosoft()"
                >
                    🔐 Aanmelden
                </button>

                <button
                    id="logoutBtn"
                    class="action-btn"
                    onclick="logoutMicrosoft()"
                    style="display:none"
                >
                    🚪 Afmelden
                </button>

            </div>

            <div id="userInfo">

                ❌ Niet aangemeld

            </div>

        </div>

        <div
            id="ccvContent"
            class="content"
        >

        </div>

    </main>

</div>

<script>

let currentUser = null;

let currentRole = "Lezen";

let msalReady = false;

let databaseCache = null;

let oneDriveIndexLoaded = false;

const msalConfig = {

    auth: {

        clientId:
            "d4d940de-49a5-4328-bb87-c0b65aeea942",

        authority:
            "https://login.microsoftonline.com/common",

        redirectUri:
            "https://pverstrepen2-dev.github.io/IBD-kennisbank/"

    }

};

const msalInstance =
    new msal.PublicClientApplication(
        msalConfig
    );

function updateUserInfo(){

    console.log(
        "updateUserInfo uitgevoerd"
    );

    console.log(
        "currentUser:",
        currentUser
    );

    const el =
        document.getElementById(
            "userInfo"
        );

    console.log(
        "userInfo element:",
        el
    );

    if(!el){
        console.error(
            "userInfo niet gevonden"
        );
        return;
    }

    if(!currentUser){

        el.innerHTML =
            "❌ Niet aangemeld";

        return;
    }

   el.innerHTML =
`
👤 ${currentUser.name}
<br>
📧 ${currentUser.email}
<br>
🛡️ ${currentRole}
`;
}

async function loginMicrosoft(){

    try{

            await msalInstance.loginRedirect({
    scopes:[
        "User.Read",
        "Files.ReadWrite"
    ]
});

    }
    catch(error){

        console.error(
            "Login fout:",
            error
        );

    }

}

async function logoutMicrosoft(){

    try{

        currentUser = null;
        await loadCurrentRole();

        updateUserInfo();

        document.getElementById(
            "loginBtn"
        ).style.display =
            "inline-block";

        document.getElementById(
            "logoutBtn"
        ).style.display =
            "none";

          await msalInstance.logoutRedirect({

    postLogoutRedirectUri:
        "https://pverstrepen2-dev.github.io/IBD-kennisbank/"

});

    }
    catch(error){

        console.error(
            "Logout fout:",
            error
        );

    }

}

async function loadCurrentRole(){

    currentRole =
        "Administrator";

}

function applyRolePermissions(){

    console.log(
        "Rol:",
        currentRole
    );

}

async function getAccessToken(){

    console.log(
        "ALL ACCOUNTS:",
        msalInstance.getAllAccounts()
    );

    const account =
        msalInstance.getAllAccounts()[0];

    if(!account){

        throw new Error(
            "Geen Microsoft-account gevonden"
        );

    }

    const response =
        await msalInstance.acquireTokenSilent({

            account,

            scopes:[

                "User.Read",
                "Files.Read"

            ]

        });

    return response.accessToken;

}

async function loadDatabaseJson(){
if(!msalReady){

    console.log(
        "MSAL nog niet klaar"
    );

    return null;
}

    try{

        const token =
    await getAccessToken();

        const fileId =
    "2B4CCFD79FF4714A!s3f1f25570cb946bfb3321950e9c2abe3";

        const response =
            await fetch(
                `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`,
                {
                    headers:{
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        databaseCache =
    await response.json();

console.log(
    "DATABASE JSON:",
    databaseCache
);

        return databaseCache;

    }
    catch(error){

        console.error(
            "Database fout:",
            error
        );

        return null;
    }
}

async function getKnowledgeData(){

    if(!databaseCache){

        await loadDatabaseJson();

    }

    console.log(
        "DATABASE CACHE:",
        databaseCache
    );

    console.log(
    "DATABASE CACHE:",
    databaseCache
);

console.log(
    "DATABASE KEYS:",
    Object.keys(databaseCache || {})
);

console.log(
    "KNOWLEDGE DATA:",
    databaseCache?.knowledgeData
);

   return (
    databaseCache?.knowledgeData
) || [];

}

async function saveDatabaseJson(){

    const token =
        await getAccessToken();

    const fileId =
        "2B4CCFD79FF4714A!s3f1f25570cb946bfb3321950e9c2abe3";

    const response =
        await fetch(
            `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`,
            {
                method: "PUT",

                headers: {
                    Authorization:
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        databaseCache,
                        null,
                        2
                    )
            }
        );

    console.log(
        "database.json opgeslagen",
        response.status
    );
}

/* =====================================================
   HIER PLAATS JE ONGEWIJZIGD DE WERKENDE CODE
   ===================================================== */

/*

1. msalConfig
2. msalInstance
3. initializeMSAL()
4. loginMicrosoft()
5. logoutMicrosoft()
6. getAccessToken()
7. loadCurrentRole()
8. applyRolePermissions()
9. loadDatabaseJson()
10. saveDatabaseJson()

*/

/* =====================================================
   NIEUWE V3 RENDERERS
   ===================================================== */
async function initializeMSAL(){

    try{

        await msalInstance.initialize();

        msalReady = true;

        const response =
            await msalInstance.handleRedirectPromise();

        console.log(
            "REDIRECT RESPONSE",
            response
        );

        console.log(
            "ACCOUNTS",
            msalInstance.getAllAccounts()
        );

        if(response){

            currentUser = {

                name:
                    response.account.name,

                email:
                    response.account.username

            };

            updateUserInfo();

            document.getElementById(
                "loginBtn"
            ).style.display = "none";

            document.getElementById(
                "logoutBtn"
            ).style.display = "inline-block";

        }
else {

    const accounts =
        msalInstance.getAllAccounts();

    if(accounts.length > 0){

        currentUser = {

            name:
                accounts[0].name,

            email:
                accounts[0].username

        };

        updateUserInfo();

    }

}
    }
    catch(error){

        console.error(error);

    }

}

async function renderDashboard(){

    try{

        const db =
            await loadDatabaseJson();

        console.log(
            "DASHBOARD DATABASE",
            db
        );

        const records =
            db?.knowledgeData?.length || 0;

        document.getElementById(
            "ccvContent"
        ).innerHTML = `

            <div class="page-title">

                Dashboard

            </div>

            <div class="card">

                ✅ Database geladen

                <br><br>

                Records:

                <b>${records}</b>

            </div>

        `;

    }
    catch(error){

        document.getElementById(
            "ccvContent"
        ).innerHTML = `

            <div class="card">

                ❌ Database fout

                <br><br>

                ${error.message}

            </div>

        `;

    }

}

function renderUsers(){

    document.getElementById(
        "ccvContent"
    ).innerHTML = `

        <div class="page-title">

            Gebruikersbeheer

        </div>

        <div class="card">

            Module volgt in V3.2

        </div>

    `;

}

async function openOneDrive(){

    try{

        const token =
            await getAccessToken();

        const response =
            await fetch(

                "https://graph.microsoft.com/v1.0/me/drive/root/children",

                {

                    headers:{

                        Authorization:
                            "Bearer " + token

                    }

                }

            );

        const data =
            await response.json();

        console.log(
            "ONEDRIVE DATA",
            data
        );

        document.getElementById(
            "ccvContent"
        ).innerHTML = `

            <div class="page-title">

                OneDrive

            </div>

            <div class="card">

                Bestanden gevonden:

                ${data.value?.length || 0}

            </div>

        `;

    }
    catch(error){

        console.error(
            "ONEDRIVE FOUT",
            error
        );

    }

}

/* =====================================================
   OPSTART
   ===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    async ()=>{

        if(
            typeof initializeMSAL
            ===
            "function"
        ){

            await initializeMSAL();

        }

        renderDashboard();

    }

);

</script>

</body>
</html>
