async function buildOneDriveIndex(){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/search(q='*')",

            {

                headers:{

                    Authorization:
                        "Bearer " + token

                }

            }

        );

    const data =
        await response.json();

    data.value.forEach(item => {

        globalIndex.push({

    source:
        item.folder
            ? "folder"
            : "file",

    id:
        item.id,

    title:
        item.name,

    webUrl:
        item.webUrl,

    location:
        item.parentReference?.path || "",

    modified:
        item.lastModifiedDateTime || "",

    size:
        item.size || 0,

    fileType:
        item.file?.mimeType || "",

    data:
        item
});

    });

}

function globalSearch(term){

    const query =

        term.toLowerCase();

    return globalIndex.filter(item =>

        JSON.stringify(item)

        .toLowerCase()

        .includes(query)

    );

}

</div>

`)
        .join("");
}

async function openSearchResult(
    source,
    id
){

    if(source === "file"){

        openFile(id);
        return;

    }

    if(source === "folder"){

        openDriveItem(id);
        return;

    }

    if(source === "knowledge"){

        const records =
            await getKnowledgeData();

        const record =
            records.find(
                r =>
                String(r.id)
                ===
                String(id)
            );

        if(!record){

            alert(
                "Record niet gevonden"
            );

            return;

        }

        const fileMatch =
            globalIndex.find(

                item =>

                    item.source === "file" &&

                    item.title &&
                    record.title &&

                    item.title.toLowerCase()
                    ===
                    record.title.toLowerCase()

            );

        if(fileMatch){

            console.log(
                "MATCH",
                fileMatch
            );

            openFile(
                fileMatch.id
            );

            return;

        }

        alert(
            "Bestand niet gevonden in OneDrive"
        );

        return;

    }

    if(source === "website"){

        const website =

            globalIndex.find(

                item =>

                    item.source === "website" &&

                    String(item.id)
                    ===
                    String(id)

            );

        if(website){

            window.open(
                website.url,
                "_blank"
            );

        }

        return;

    }

}

async function openKnowledgeRecord(id){

    const records =
        await getKnowledgeData();

    const record =
        records.find(
            r => String(r.id) === String(id)
        );

    if(!record){

        alert(
            "Record niet gevonden"
        );

        return;
    }

    const fileMatch =
        globalIndex.find(

            item =>

                item.source === "file" &&

                item.title.toLowerCase() ===
                record.title.toLowerCase()

        );

    if(fileMatch){

        openFile(
            fileMatch.id
        );

        return;
    }

    alert(
        "Bestand niet gevonden in OneDrive-index"
    );

}

function runSearch(){

const filterBox =

if(
    !searchBox ||
    !filterBox
){

    return;

}

    const term =

    searchBox.value
    .toLowerCase();

    const filter =
    filterBox.value;

    let results =

        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                r =>
                    r.source === filter
            );

    }

    renderResults(results);

}

async function filterWebsites(){

    const websites =
        await loadWebsites();

    const search =

        document
            .getElementById(
                "websiteSearch"
            )
            .value
            .toLowerCase();

    const country =

        document
            .getElementById(
                "websiteCountry"
            )
            .value;

        const category =

    document
        .getElementById(
            "websiteCategory"
        )
        .value;

const subCategory =

    document
        .getElementById(
            "websiteSubCategory"
        )
        ?.value || "";

const favoritesOnly =

    document
        .getElementById(
            "favoritesOnly"
        )
        .checked;

    const filtered =

        websites.filter(site => {

            const text =

    `

        ${site.titel || ""}

        ${site.title || ""}

        ${site.land || ""}

        ${site.categorie || ""}

        ${site.subcategorie || ""}

        ${site.beschrijving || ""}

        ${

            Array.isArray(
                site.tags
            )

                ?

            site.tags.join(" ")

                :

            site.tags || ""

        }

    `

    .toLowerCase();

            const searchMatch =

    text.includes(
        search
    );

const countryMatch =

    !country ||

    site.land === country;

const categoryMatch =

    !category ||

    site.subcategorie === category ||

    site.category === category;

const subCategoryMatch =

    !subCategory ||

    site.subcategorie === subCategory;

const favoriteMatch =

    !favoritesOnly ||

    site.favorite === true;

return(

    searchMatch &&

    countryMatch &&

    categoryMatch &&

    subCategoryMatch &&

    favoriteMatch

);

        });

    renderWebsiteList(
        filtered
    );

}

function calculateSemanticScore(item){

    let score = 0;

    if(item.tags){

        score += Array.isArray(item.tags)
            ? item.tags.length
            : 1;
    }

    if(item.relationships){

        score += item.relationships.length * 2;
    }

    if(item.description){

        score += 1;
    }

    return score;
}

function buildSemanticRelations(){

    globalIndex.forEach(item=>{

        if(!item.relationships){

            item.relationships = [];

        }

        globalIndex.forEach(other=>{

            if(item === other){
                return;
            }

            const similarity =

                calculateSimilarity(
                    item,
                    other
                );

            if(similarity >= 2){

                const exists =

                    item.relationships.some(

                        rel =>

                            String(rel.id)
                            ===
                            String(other.id)

                    );

                if(!exists){

                    item.relationships.push({

                        id:other.id,

                        source:other.source,

                        type:RELATIONS.RELATED,

                        automatic:true,

                        weight:similarity

                    });

                }

            }

        });

    });

}

function normalizeTags(tags){

    if(!tags){

        return [];
    }

    if(Array.isArray(tags)){

        return tags
            .map(t=>t.toLowerCase().trim());
    }

    return String(tags)

        .split(",")

        .map(t=>t.toLowerCase().trim())

        .filter(Boolean);
}

function buildKnowledgeNetwork(){

    buildConceptClusters();

    buildSemanticRelations();

    KnowledgeHub.nodes = [];
    KnowledgeHub.edges = [];

    const addedNodes =
        new Set();

    globalIndex.forEach(item=>{

        const nodeId =

            item.source +
            "_" +
            item.id;

        if(!addedNodes.has(nodeId)){

            KnowledgeHub.nodes.push({

                id:nodeId,

                label:

                    item.title ||

                    item.name ||

                    String(item.id),

                group:item.source,

                value:
                    calculateSemanticScore(
                        item
                    )

            });

            addedNodes.add(nodeId);

        }

        (item.relationships || [])

        .forEach(rel=>{

            KnowledgeHub.edges.push({

                from:nodeId,

                to:
                    rel.source +
                    "_" +
                    rel.id,

                width:
                    rel.weight || 1,

                color:

                    rel.automatic

                        ? "#4caf50"

                        : "#2196f3"

            });

        });

    });

    const container =

        document.getElementById(
            "knowledgeNetwork"
        );

    window.knowledgeNetwork =

        new vis.Network(

            container,

            {

                nodes:
                    KnowledgeHub.nodes,

                edges:
                    KnowledgeHub.edges

            },

            {

                interaction:{

                    hover:true,

                    navigationButtons:true,

                    multiselect:true

                },

                physics:{

                    enabled:true,

                    stabilization:true

                },

                groups:{

                    knowledge:{
                        color:"#4caf50"
                    },

                    website:{
                        color:"#ff9800"
                    },

                    file:{
                        color:"#2196f3"
                    },

                    folder:{
                        color:"#9c27b0"
                    }

                }

            }

        );

    knowledgeNetwork.on(

        "click",

        params=>{

            if(

                params.nodes.length

            ){

                showKnowledgeExplorer(

                    params.nodes[0]

                );

            }

        }

    );

}

function focusTagCluster(tag){

    const ids = [];

    globalIndex.forEach(item=>{

            normalizeTags(item.tags);

            tags.includes(
                tag.toLowerCase()
            )
        ){

            ids.push(

                item.source +
                "_" +
                item.id

            );

        }

    });

    knowledgeNetwork.selectNodes(ids);

function searchKnowledgeNode(){

    const term =

        document
        .getElementById(
            "knowledgeSearch"
        )
        .value
        .toLowerCase()
        .trim();

    if(!term){

        return;

    }

    const node =

        globalIndex.find(item=>{

            return JSON.stringify(item)

                .toLowerCase()

                .includes(term);

        });

    if(!node){

        return;

    }

    const nodeId =

        node.source +
        "_" +
        node.id;

    knowledgeNetwork.focus(

        nodeId,

        {

            scale:1.5,

            animation:true

        }

    );

    knowledgeNetwork.selectNodes(
        [nodeId]
    );

    showKnowledgeExplorer(
        nodeId
    );

}

function buildSemanticRelations(){

    globalIndex.forEach(item => {

        const tags =

    Array.isArray(item.tags)

        ?

    item.tags

        :

    typeof item.tags === "string"

        ?

    item.tags

        .split(",")

        .map(
            tag => tag.trim()
        )

        .filter(Boolean)

        :

    [];

        globalIndex.forEach(other => {

            if(
                item === other
            ){

                return;

            }

            const otherTags =

    Array.isArray(other.tags)

        ?

    other.tags

        :

    typeof other.tags === "string"

        ?

    other.tags

        .split(",")

        .map(
            tag => tag.trim()
        )

        .filter(Boolean)

        :

    [];

            const commonTags =

                tags.filter(

                    tag =>

                        otherTags.includes(
                            tag
                        )

                );

            if(
                commonTags.length >= 2
            ){

                if(
                    !item.relationships
                ){

                    item.relationships = [];

                }

                item.relationships.push({

                    id:other.id,

                    type:other.source,

                    automatic:true

                });

            }

        });

    });

}

function createManualRelation(

    sourceNode,

    targetNode

){

    if(
        sourceNode === targetNode
    ){

        return;

    }

    const sourceParts =
        sourceNode.split("_");

    const sourceType =
        sourceParts[0];

    const sourceId =
        sourceParts.slice(1).join("_");

    const sourceItem =

        globalIndex.find(

            item =>

                item.source === sourceType &&

                String(item.id)
                ===
                String(sourceId)

        );

    if(!sourceItem){

        return;

    }

    if(
        !sourceItem.relationships
    ){

        sourceItem.relationships = [];

    }

    sourceItem.relationships.push({

        id:targetNode,

        type:"manual",

        created:
            new Date()
            .toISOString()

    });

    buildKnowledgeNetwork();

}

function normalizeTags(tags){

    if(!tags){
        return [];
    }

    if(Array.isArray(tags)){

        return tags
            .map(tag=>tag.toLowerCase().trim())
            .filter(Boolean);

    }

    return String(tags)

        .split(",")

        .map(tag=>tag.toLowerCase().trim())

        .filter(Boolean);

}

function calculateSemanticScore(item){

    let score = 1;

    score += normalizeTags(
        item.tags
    ).length;

    score +=

        item.relationships
            ? item.relationships.length
            : 0;

    if(item.description){
        score += 2;
    }

    return score;

}

const RELATIONS = {

    RELATED:"related",

    CONTAINS:"contains",

    REFERENCES:"references",

    SOURCE:"source",

    PARTOF:"partof",

    CHILD:"child",

    PARENT:"parent"

};

function calculateSimilarity(
    item,
    other
){

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    return tags1.filter(

        tag =>

            tags2.includes(tag)

    ).length;

}
