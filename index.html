async function initializeMSAL() {

    try {

        console.log("MSAL initialiseren...");

        if (!msalInstance) {

            msalInstance =
                new msal.PublicClientApplication(msalConfig);

        }

        await msalInstance.initialize();

        msalReady = true;

        console.log("MSAL klaar");

        const response =
            await msalInstance.handleRedirectPromise();

        if (response && response.account) {

            msalInstance.setActiveAccount(
                response.account
            );

            currentUser = {

                name:
                    response.account.name ||
                    response.account.username,

                email:
                    response.account.username

            };

        } else {

            const accounts =
                msalInstance.getAllAccounts();

            if (accounts.length > 0) {

                msalInstance.setActiveAccount(
                    accounts[0]
                );

                currentUser = {

                    name:
                        accounts[0].name ||
                        accounts[0].username,

                    email:
                        accounts[0].username

                };

            }

        }

        if (currentUser) {

            await loadCurrentRole();

            updateUserInfo();

            document.getElementById(
                "loginBtn"
            ).style.display = "none";

            document.getElementById(
                "logoutBtn"
            ).style.display = "inline-block";

            try {

                await buildSearchIndex();

            } catch (error) {

                console.error(
                    "Index fout:",
                    error
                );

            }

        } else {

            document.getElementById(
                "loginBtn"
            ).style.display = "inline-block";

            document.getElementById(
                "logoutBtn"
            ).style.display = "none";

            updateUserInfo();

        }

    } catch (error) {

        console.error(
            "MSAL initialisatie fout:",
            error
        );

    }

}

function addToIndexService(item){

    const key =
        item.source +
        "_" +
        item.id;

    IndexService.byId[key] = item;

    if(!IndexService.bySource[item.source]){
        IndexService.bySource[item.source] = [];
    }

    IndexService.bySource[item.source].push(item);

    if(item.associationName){

        if(
            !IndexService.byAssociation[
                item.associationName
            ]
        ){
            IndexService.byAssociation[
                item.associationName
            ] = [];
        }

        IndexService.byAssociation[
            item.associationName
        ].push(item);

    }

    const category =
        item.managementCategory ||
        item.mainCategory ||
        item.category;

    if(category){

        if(
            !IndexService.byCategory[
                category
            ]
        ){
            IndexService.byCategory[
                category
            ] = [];
        }

        IndexService.byCategory[
            category
        ].push(item);

    }

}

async function getAccessToken()
{
    const accounts =
        msalInstance.getAllAccounts();

    if(!accounts.length)
    {
        console.warn(
            "Geen Microsoft-account gevonden"
        );

        return null;
    }

    availableAccounts =
        accounts;

    const account =
        currentCalendarAccount
        ||
        accounts[0];

    try
    {
        const response =
            await msalInstance.acquireTokenSilent({

                account,

                scopes:[

                    "User.Read",

                    "Files.ReadWrite",

                    "Mail.Read",

                    "Calendars.Read",

                    "Calendars.ReadWrite"

                ]

            });

        return response.accessToken;
    }
    catch(error)
    {
        console.error(
            "Token fout:",
            error
        );

        return null;
    }
}

async function buildKnowledgeIndex(){
    console.trace("buildKnowledgeIndex gestart");

    const records =
        await getKnowledgeData();

    if(!Array.isArray(records)){

        console.error(
            "Geen knowledgeData gevonden",
            records
        );

        return;
    }

    const existingKeys =
        new Set(

            globalIndex

            .filter(
                item =>
                    item.source === "knowledge"
            )

            .map(
                item =>
                    `knowledge_${
                        item.id
                    }`
            )

        );

    let addedCount = 0;

    let skippedCount = 0;

    records.forEach(record => {

        const recordId =

            record.id ||

            (
                record.title || ""
            )
            .toLowerCase()
            .trim();

        const uniqueKey =
            `knowledge_${recordId}`;

        if(
            existingKeys.has(
                uniqueKey
            )
        ){

            skippedCount++;

            return;
        }

        existingKeys.add(
            uniqueKey
        );

        const autoTaxonomy =
    detectTaxonomy(
        record
    );

        const item = {

            source : "knowledge",

            id :
                record.id ||
                Date.now() +
                Math.random(),

            title :
                record.title ||
                "Naamloos document",

            description :
                record.description ||
                "",

            mainCategory :
    record.taxonomy?.mainCategory ||
    record.mainCategory ||
    "Overig",

            subCategory :
    record.taxonomy?.subCategory ||
    record.subCategory ||
    "Algemeen",

            category :
                record.mainCategory ||
                record.category ||
                "Overig",

            tags :

                Array.isArray(
                    record.tags
                )

                ? record.tags

                : [],

            relationships :

                Array.isArray(
                    record.relationships
                )

                ? record.relationships

                : [],

            language :
                record.language ||
                "NL",

            audience :

    record.taxonomy?.audience ||

    record.audience ||

    ["Iedereen"],

            type :

    record.taxonomy?.contentType ||

    record.type ||

    "artikel",


            fileName :
                record.fileName ||
                "",

            oneDriveId :
                record.oneDriveId ||
                "",

            author :
                record.author ||
                "",

            status :
                record.status ||
                "Actief",

            created :
                record.created ||
                "",

            modified :
                record.modified ||
                "",

            semanticScore :

                (
                    Array.isArray(

        globalIndex.push(

addToIndexService(item);

async function scanDriveFolder(
    token,
    folderId,
    path = ""
){

    let results = [];

    try{

        let nextUrl =
            `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children?$top=999`;

        while(nextUrl){

            const response =
                await fetch(
                    nextUrl,
                    {
                        headers:{
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );

            if(!response.ok){

                console.error(
                    "Graph fout:",
                    response.status,
                    response.statusText
                );

                break;
            }

            const data =
                await response.json();

            const items =
                data.value || [];

            for(const item of items){

                const currentPath =
                    path
                        ? `${path}/${item.name}`
                        : item.name;

                const normalizedItem = {

                    id :
                        item.id,

                    name :
                        item.name,

                    fullPath :
                        currentPath,

                    webUrl :
                        item.webUrl || "",

                    size :
                        item.size || 0,

                    folder :
                        item.folder || null,

                    file :
                        item.file || null,

                    package :
                        item.package || null,

                    remoteItem :
                        item.remoteItem || null,

                    shared :
                        item.shared || null,

                    createdDateTime :
                        item.createdDateTime || "",

                    lastModifiedDateTime :
                        item.lastModifiedDateTime || "",

                    childCount :
                        item.folder?.childCount || 0

                };

                results.push(
                    normalizedItem
                );

                /* ==========================
                   Submappen verwerken
                   ========================== */

                if(item.folder){

    const folderSignature =
        item.id;

    if(
        scannedFolderNames.has(
            folderSignature
        )
    ){

        console.log(
            "Map reeds verwerkt:",
            currentPath
        );

        continue;

    }

    scannedFolderNames.set(
        folderSignature,
        currentPath
    );

                    try{

                        const childItems =

                            await scanDriveFolder(

                                token,

                                item.id,

                                currentPath

                            );

                        results.push(
                            ...childItems
                        );

                    }
                    catch(error){

                        console.error(
                            "Submap fout:",
                            currentPath,
                            error
                        );

                    }

                }

            }

            nextUrl =
                data["@odata.nextLink"] || null;

            if(nextUrl){

                console.log(
                    "➡ Volgende pagina..."
                );

            }

        }

        return results;

    }
    catch(error){

        console.error(
            "scanDriveFolder fout:",
            error
        );

        return results;

    }

}

async function getFolderByPath(
    folderName
){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/children",

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const data =
        await response.json();

    const rootFolder =

        (data.value || []).find(

            item =>

                item.folder &&

                item.name === "CCV-VZW"

        );

    if(
        !rootFolder
    ){

        console.error(
            "CCV-VZW niet gevonden"
        );

        return null;

    }

    const childrenResponse =
        await fetch(

            `https://graph.microsoft.com/v1.0/me/drive/items/${rootFolder.id}/children`,

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const childrenData =
        await childrenResponse.json();

    const targetFolder =

        (childrenData.value || []).find(

            item =>

                item.folder &&

                item.name === folderName

        );

    return targetFolder || null;

}

function getAssociationDocuments(
    associationName
){
    const folderId =
        associationFolderMap[
            associationName

    if(!folderId){
        return [];
    }

    return globalIndex.filter(item => {

        if(item.source !== "file"){

        const fileFolderId =
            item.data?.parentReference?.id ||
            "";

        return (
            fileFolderId === folderId
        );

    });

function scoreAssociationItem(item, question)
{
    const words =
        question
        .toLowerCase()
        .split(/\s+/)
        .filter(word => word.length > 2);

    const text = `
        ${item.title || ""}
        ${item.description || ""}
        ${item.content || ""}
        ${item.location || ""}
        ${item.sender || ""}
        ${item.category || ""}
        ${normalizeTags(item.tags).join(" ")}
    `
    .toLowerCase();

    let score = 0;

    words.forEach(word =>
    {
        if(text.includes(word))
        {
            score += 10;
        }
    });

    score += calculateSemanticScore(item);

    return score;
}

function getAssociationContext(
    associationName,
    question
)
{
    const association =
        associationName.toLowerCase();

    const documents =
        getAssociationDocuments(
            associationName
        );

    const captures =
        (
            DatabaseService.cache
            ?.quickCaptures || []
        )
        .filter(item =>
            (
                item.organization || ""
            )
            .toLowerCase()
            === association
        );

    const websites =
        websitesCache.filter(site =>
        {
            const text = `
                ${site.association || ""}
                ${site.organization || ""}
                ${site.title || ""}
            `
            .toLowerCase();

            return text.includes(
                association
            );
        });

    const emails =
        globalIndex.filter(item =>
        {
            if(item.source !== "email")
            {
                return false;
            }

            const text = `
                ${item.title || ""}
                ${item.description || ""}
                ${item.sender || ""}
            `
            .toLowerCase();

            return text.includes(
                association
            );
        });

    const allResults = [

        ...documents,

        ...captures.map(c => ({
            ...c,
            source : "capture"
        })),

        ...websites.map(w => ({
            ...w,
            source : "website"
        })),

        ...emails

    ];

    return allResults
        .map(item =>
        ({
            item,
            score :
                scoreAssociationItem(
                    item,
                    question
                )
        }))
        .sort(
            (a,b) =>
                b.score - a.score
        )
        .slice(0,25);
}

            const title =
                (
                    item.title || ""
                )
                .toLowerCase();

            words.forEach(word =>
            {
                if(
                    title.includes(word)
                )
                {
                    score += 25;
                }
            });

            score +=
                calculateSemanticScore(
                    item
                );

            return {
                item,
                score
            };
        })
        .sort(
            (a,b) =>
                b.score - a.score
        );
}

function buildAISummary(
    question,
    results
)
{
    const top =
        results.slice(0,10);

    let summary = [];

    summary.push(
        `Vraag: ${question}`
    );

    summary.push("");

    summary.push(
        `Ik vond ${top.length} relevante bronnen.`
    );

    summary.push("");

    top.forEach(result =>
    {
        const item =
            result.item;

        summary.push(

            `• ${
                item.title
            }`

        );

        if(item.description)
        {
            summary.push(
                item.description
                    .substring(
                        0,
                        200
                    )
            );
        }

        summary.push("");
    });

    return summary.join("\n");
}

function findRelatedCaptures(
    capture,
    allCaptures
)
{
    return allCaptures

        .filter(
            x =>
                x.id !== capture.id
        )

        .map(
            x =>
            {
                let score = 0;

                if(
                    x.aiCategory ===
                    capture.aiCategory
                )
                {
                    score += 5;
                }

                if(
                    x.aiSubCategory ===
                    capture.aiSubCategory
                )
                {
                    score += 3;
                }

                (x.aiTags || [])
                .forEach(tag =>
                {
                    if(
                        (
                            capture.aiTags ||
                            []
                        ).includes(tag)
                    )
                    {
                        score += 2;
                    }
                });

                return {
                    capture:x,
                    score
                };
            }
        )

        .filter(
            x => x.score > 0
        )

        .sort(
            (a,b) =>
                b.score - a.score
        )

        .slice(0,5)

        .map(
            x => x.capture
        );
}

async function openCaptureAttachment(
    captureId
)
{
    const db =
        await DatabaseService.load();

    const capture =
        (
            db.quickCaptures || []
        ).find(
            x =>
                String(x.id)
                ===
                String(captureId)
        );

    if(
        !capture ||
        !capture.attachmentContent
    )
    {
        alert(
            "Geen bijlage gevonden."
        );
        return;
    }

    try
    {
        const response =
            await fetch(
                capture.attachmentContent
            );

        const blob =
            await response.blob();

        const blobUrl =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            blobUrl;

        link.download =
            capture.attachmentName
            || "document.pdf";

        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );

        setTimeout(
            () =>
            {
                URL.revokeObjectURL(
                    blobUrl
                );
            },
            3000
        );

const IndexSettings = {

    keepLatestVersionOnly : true,

    detectVersions : true

};

function chooseNewestVersion(items){

    if(items.length <= 1){

        return items[0];

    }

    return items.sort(

        (a,b)=>

            new Date(
                b.lastModifiedDateTime || 0
            )

            -

            new Date(
                a.lastModifiedDateTime || 0
            )

    )[0];

}

function processDocumentVersions(allItems){

    const groups = {};

    const folders =
        allItems.filter(
            item => item.folder
        );

    const files =
        allItems.filter(
            item => !item.folder
        );

    let keptVersions = 0;
    let removedVersions = 0;

    documentVersions = {};

    files.forEach(item => {

        const signature =

            (
                item.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                item.size || 0
            );

        if(!groups[signature]){

            groups[signature] = [];

        }

        groups[signature].push(
            item
        );

    });

    const filteredFiles = [];

    Object.values(groups)
    .forEach(group => {

        const newest =
            chooseNewestVersion(
                group
            );

        filteredFiles.push(
            newest
        );

        const versionKey =

            (
                newest.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                newest.size || 0
            );

        documentVersions[
            versionKey
        ] =

            group.sort(

                (a,b)=>

                    new Date(
                        b.lastModifiedDateTime || 0
                    )

                    -

                    new Date(
                        a.lastModifiedDateTime || 0
                    )

            );

        if(group.length > 1){

            keptVersions++;

            removedVersions +=
                group.length - 1;

        }

    });

    console.log(
        "VERSIEGROEPEN:",
        keptVersions
    );

    console.log(
        "UITGEFILTERDE VERSIES:",
        removedVersions
    );

    return [

        ...folders,
        ...filteredFiles

    ];

}

async function extractPdfContent(fileId){

    try{

        const token =
            await getAccessToken();

        const response =
            await fetch(

                `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`,

                {

                    headers:{

                        Authorization:
                            "Bearer " + token

                    }

                }

            );
        if(!response.ok){

    console.warn(
        "PDF niet leesbaar:",
        fileId,
        response.status
    );

    return "";

}

        const buffer =
            await response.arrayBuffer();

        const pdf =

            await pdfjsLib
            .getDocument({

                data:buffer

            })
            .promise;

        let text = "";

        for(

            let pageNumber = 1;

            pageNumber <= pdf.numPages;

            pageNumber++

        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );

            const content =
                await page.getTextContent();

            text +=

                content.items

                .map(
                    item => item.str
                )

                .join(" ");

        }

        return text;

    }
    catch(error){

        console.error(
            "PDF extract fout",
            error
        );

        return "";

    }

}

function runSearch(){

    const searchBox =
        document.getElementById(
            "globalSearch"
        );

    const filterBox =
        document.getElementById(
            "searchFilter"
        );

    if(
        !searchBox ||
        !filterBox
    ){
        return;
    }

    const term =
        searchBox.value
        .trim()
        .toLowerCase();

    const filter =
        filterBox.value;

    let results =
        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                item =>
                    item.source === filter
            );

    }

    results.sort((a,b)=>{

        const aTitle =
            (a.title || "")
            .toLowerCase();

        const bTitle =
            (b.title || "")
            .toLowerCase();

        return aTitle.localeCompare(
            bTitle
        );

    });

    renderResults(results);

}

async function filterWebsites(){

    const websites =
        await loadWebsites();

    const search =

        document
            .getElementById(
                "websiteSearch"
            )
            .value
            .toLowerCase();

    const country =

        document
            .getElementById(
                "websiteCountry"
            )
            .value;

        const category =

    document
        .getElementById(
            "websiteCategory"
        )
        .value;

const subCategory =

    document
        .getElementById(
            "websiteSubCategory"
        )
        ?.value || "";

const favoritesOnly =

    document
        .getElementById(
            "favoritesOnly"
        )
        .checked;

    const filtered =

        websites.filter(site => {

            const text =

    `

        ${site.titel || ""}

        ${site.title || ""}

        ${site.land || ""}

        ${site.categorie || ""}

        ${site.subcategorie || ""}

        ${site.beschrijving || ""}

        ${

            Array.isArray(
                site.tags
            )

                ?

            site.tags.join(" ")

                :

            site.tags || ""

        }

    `

    .toLowerCase();

            const searchMatch =

    text.includes(
        search
    );

const countryMatch =

    !country ||

    site.land === country;

const categoryMatch =

    !category ||

    site.subcategorie === category ||

    site.category === category;

const subCategoryMatch =

    !subCategory ||

    site.subcategorie === subCategory;

const favoriteMatch =

    !favoritesOnly ||

    site.favorite === true;

return(

    searchMatch &&

    countryMatch &&

    categoryMatch &&

    subCategoryMatch &&

    favoriteMatch

);

        });

    renderWebsiteList(
        filtered
    );

}

function determineManagementCategory(path){

    const p = (path || "")
        .toLowerCase();

    if(p.includes("ledenbeheer")){
        return "members";
    }

    if(p.includes("projecten")){
        return "projects";
    }

    if(p.includes("vergaderingen")){
        return "meetings";
    }

    if(p.includes("kasboek")){
        return "finance";
    }

    if(p.includes("onkosten")){
        return "finance";
    }

    if(p.includes("post_verzendingen")){
        return "shipping";
    }

    if(p.includes("admin_ccv")){
        return "administration";
    }

    return "";
}

function determineManagementSubCategory(
    path
){

    const parts =
        (path || "")
        .split("/");

    const baseFolders = [

        "ledenbeheer",
        "projecten",
        "vergaderingen",
        "onkosten",
        "kasboek",
        "admin_ccv",
        "post_verzendingen"

    ];

    const matchIndex =

        parts.findIndex(

            part =>

                baseFolders.includes(
                    part.toLowerCase()
                )

        );

    if(
        matchIndex >= 0 &&

        parts.length >
        matchIndex + 1
    ){

        return parts[
            matchIndex + 1
        ];

    }

    return "Algemeen";

}

async function createCalendarEvent()
{
    try{

        const token =
            await getAccessToken();

        const body = {

            subject :
                document.getElementById(
                    "eventTitle"
                ).value,

            start : {

                dateTime :
                    document.getElementById(
                        "eventStart"
                    ).value,

                timeZone :
                    "Europe/Brussels"

            },

            end : {

                dateTime :
                    document.getElementById(
                        "eventEnd"
                    ).value,

                timeZone :
                    "Europe/Brussels"

            },

            location : {

                displayName :
                    document.getElementById(
                        "eventLocation"
                    ).value

            },

            body : {

                contentType :
                    "text",

                content :
                    document.getElementById(
                        "eventBody"
                    ).value

            }

        };

        const response =
            await fetch(
                "https://graph.microsoft.com/v1.0/me/events",
                {
                    method:"POST",

                    headers:{
                        Authorization:
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

            .trim();

        document
            .getElementById(
                "relationshipType"
            )

    const website =

        websitesCache.find(

            w =>

function findRelatedDocuments(
    tags
)
{
    if(!tags?.length)
    {
        return [];
    }

    return globalIndex.filter(
        item =>
        {
            let itemTags = "";

            if(
                Array.isArray(
                    item.tags
                )
            )
            {
                itemTags =
                    item.tags.join(" ");
            }
            else
            {
                itemTags =
                    String(
                        item.tags || ""
                    );
            }

            const text = `
                ${item.title || ""}
                ${item.description || ""}
                ${item.content || ""}
                ${itemTags}
            `
            .toLowerCase();

            return tags.some(
                tag =>
                    text.includes(
                        tag.toLowerCase()
                    )
            );
        }
    );
}

function normalizeTags(tags){

    if(!tags){
        return [];
    }

    if(Array.isArray(tags)){
        return tags
            .map(t => String(t).trim().toLowerCase())
            .filter(Boolean);
    }

    if(typeof tags === "string"){
        return tags
            .split(",")
            .map(t => t.trim().toLowerCase())
            .filter(Boolean);
    }

    return [];
}

function buildKnowledgeKeywords(
    knowledgeItem
){

    const keywords = new Set();

    (knowledgeItem.title || "")
        .toLowerCase()
        .split(/\s+/)
        .filter(word => word.length > 3)
        .forEach(word => keywords.add(word));

    normalizeTags(
        knowledgeItem.tags
    ).forEach(
        tag => keywords.add(
            tag.toLowerCase()
        )
    );

    const taxonomy =
        knowledgeItem.taxonomy || {};

    Object.keys(taxonomy)
        .filter(
            key => taxonomy[key] === true
        )
        .forEach(
            key => keywords.add(
                key.toLowerCase()
            )
        );

    return keywords;

}

function getKnowledgeMapItems(){

    const sourceFilter =
        document.getElementById(
            "mapSourceFilter"
        )?.value || "all";

    const libraryFilter =
        document.getElementById(
            "mapLibraryFilter"
        )?.value || "all";

    const categoryFilter =
        document.getElementById(
            "mapCategoryFilter"
        )?.value || "all";

    const linkedOnly =
        document.getElementById(
            "linkedOnly"
        )?.checked;

    const relatedOnly =
        document.getElementById(
            "relatedOnly"
        )?.checked;

    const maxNodes =
        parseInt(
            document.getElementById(
                "mapNodeLimit"
            )?.value || 250
        );

    let items = [...globalIndex];

    if(sourceFilter !== "all"){

        items = items.filter(
            item =>
                item.source ===
                sourceFilter
        );

    }

    if(libraryFilter !== "all"){

        items = items.filter(
            item =>
                item.libraryType ===
                libraryFilter
        );

    }

    if(categoryFilter !== "all"){

        items = items.filter(
            item =>
                item.category ===
                categoryFilter
                ||
                item.mainCategory ===
                categoryFilter
        );

    }

    if(linkedOnly){

        items = items.filter(
            item =>
                item.oneDriveId
        );

    }

    if(relatedOnly){

        items = items.filter(
            item =>
                item.relationships &&
                item.relationships.length > 0
        );

    }

    items.sort((a,b)=>{

    const weight = {

        knowledge:1,
        folder:2,
        file:3,
        website:4

    };

    return (
        (weight[a.source] || 99)
        -
        (weight[b.source] || 99)
    );

});

const grouped = {

    knowledge : items.filter(
        x => x.source === "knowledge"
    ),

    file : items.filter(
        x => x.source === "file"
    ),

    folder : items.filter(
        x => x.source === "folder"
    ),

    website : items.filter(
        x => x.source === "website"
    )

};

return [

    ...grouped.knowledge.slice(0,100),

    ...grouped.file.slice(0,300),

    ...grouped.folder.slice(0,200),

    ...grouped.website.slice(0,100)

].slice(0,maxNodes);

}

async function askAssociationAI(
    associationName,
    question
)
{
    const context =
        getAssociationContext(
            associationName,
            question
        );

    /* ----------------------------------
       Documentinhoud laden
       ---------------------------------- */

    for(const result of context)
    {
        const item = result.item;

        if(
            item &&
            item.source === "file"
        )
        {
            await ensureDocumentContent(
                item
            );
        }
    }

    /* ----------------------------------
       Ranking uitvoeren
       ---------------------------------- */

    const ranked =
        rankKnowledgeResults(
            question,
            context.map(
                x => x.item
            )
        );

    /* ----------------------------------
       Samenvatting
       ---------------------------------- */

    const summary =
        buildAISummary(
            question,
            ranked
        );

    /* ----------------------------------
       Resultaat tonen
       ---------------------------------- */

    renderAssociationAIAnswer(
        associationName,
        question,
        summary,
        ranked
    );
}

function buildSemanticRelations(){

    console.log(
        "Semantische relaties opbouwen..."
    );

    const processedPairs =
        new Set();

    let itemsWithRelations = 0;

    globalIndex.forEach(item=>{

        const manualRelations =

    (item.relationships || [])

    .filter(
        rel =>
            rel.type === "manual"
    );

item.relationships =
    [...manualRelations];

    });

    globalIndex.forEach(item=>{

        const itemId =
            item.source +
            "_" +
            item.id;

        const itemKeywords =
            documentKeywordIndex[
                itemId
            ] || [];

        if(
            itemKeywords.length === 0
        ){
            return;
        }

        const candidateIds =
            new Set();

        itemKeywords.forEach(keyword=>{

            const matchingDocs =
                keywordToDocuments[
                    keyword
                ] || [];

            if(
                matchingDocs.length > 50
            ){
                return;
            }

            matchingDocs.forEach(docId=>{

                if(docId !== itemId){

                    candidateIds.add(
                        docId
                    );

                }

            });

        });

        const tempRelations = [];

        candidateIds.forEach(candidateId=>{

            const other =
                globalIndexMap[
                    candidateId
                ];

            if(!other){
                return;
            }

            if(
                item.source === "folder" ||
                other.source === "folder"
            ){
                return;
            }

            const sourceId =
                itemId;

            const targetId =
                candidateId;

            const pairKey =
                [
                    sourceId,
                    targetId
                ]
                .sort()
                .join("|");

            if(
                processedPairs.has(
                    pairKey
                )
            ){
                return;
            }

            processedPairs.add(
                pairKey
            );

            const similarity =
                calculateSimilarity(
                    item,
                    other
                );

            if(similarity === 0){
    return;
}

            const semanticScore =
                calculateContentSimilarity(
                    item,
                    other
                );

            const totalScore =
                similarity * 5 +
                semanticScore;

            if(totalScore < 10){
                return;
            }

            tempRelations.push({

                id:
                    other.id,

                source:
                    other.source,

                type:
                    "related",

                automatic:
                    true,

                weight:
                    totalScore

            });

        });

        item.relationships =
            tempRelations
            .sort(
                (a,b)=>
                    b.weight - a.weight
            )
            .slice(0,2);

        if(
            item.relationships.length
        ){
            itemsWithRelations++;
        }

    });

    semanticConnectionsBuilt =
        true;

    console.log(
        "Items met relaties:",
        itemsWithRelations
    );

    console.log(
        "Semantische relaties opgebouwd"
    );

}

function buildDocumentConnections(){

    documentConnections = [];

    const processedPairs =
        new Set();

    const createdConnections =
        new Map();

    Object.entries(
        keywordToDocuments
    ).forEach(

        ([keyword, docs])=>{

            if(
                docs.length < 2
            ){
                return;
            }

            if(
                docs.length > 100
            ){
                return;
            }

            for(
                let i = 0;
                i < docs.length;
                i++
            ){

                for(
                    let j = i + 1;
                    j < docs.length;
                    j++
                ){

                    const source =
                        docs[i];

                    const target =
                        docs[j];

                    const pairKey =
                        [source,target]
                        .sort()
                        .join("|");

                    if(
                        processedPairs.has(
                            pairKey
                        )
                    ){
                        continue;
                    }

                    processedPairs.add(
                        pairKey
                    );

                    const sourceItem =
    globalIndexMap[source];

const targetItem =
    globalIndexMap[target];

                    if(
                        !sourceItem ||
                        !targetItem
                    ){
                        continue;
                    }

                    const score =
                        calculateContentSimilarity(
                            sourceItem,
                            targetItem
                        );

                    if(
                        score <
                        minimumRelationScore
                    ){
                        continue;
                    }

                    createdConnections.set(
                        pairKey,
                        {
                            source,
                            target,
                            score,
                            automatic:true
                        }
                    );

                }

            }

        }

    );

    documentConnections =
        [...createdConnections.values()]
        .sort(
            (a,b)=>
                b.score - a.score
        )
        .slice(0,250);

    console.log(
        "Document connecties:",
        documentConnections.length
    );

}

        getKnowledgeMapItems();

            item.source +

function createManualRelation(

        sourceParts[0];

    RELATED:"related",

    CONTAINS:"contains",

    REFERENCES:"references",

};

function calculateSimilarity(
    item,
    other
){

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    return tags1.filter(

        tag =>

            tags2.includes(tag)

    ).length;

}

function calculateContentSimilarity(
    item,
    other
){

    const itemId =
        item.source +
        "_" +
        item.id;

    const otherId =
        other.source +
        "_" +
        other.id;

    const keywords1 =
        documentWordIndex[itemId];

    const keywords2 =
        documentWordIndex[otherId];

    if(
        !keywords1 ||
        !keywords2
    ){
        return 0;
    }

    let score = 0;

    const smallest =
        keywords1.size <
        keywords2.size
            ? keywords1
            : keywords2;

    const largest =
        keywords1.size <
        keywords2.size
            ? keywords2
            : keywords1;

    smallest.forEach(word=>{

        if(
            largest.has(word)
        ){
            score += 2;
        }

    });

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    tags1.forEach(tag=>{

        if(
            tags2.includes(tag)
        ){
            score += 5;
        }

    });

    if(
        item.category &&
        other.category &&
        item.category === other.category
    ){
        score += 3;
    }

    if(
        item.mainCategory &&
        other.mainCategory &&
        item.mainCategory ===
        other.mainCategory
    ){
        score += 5;
    }

    return score;

}

    .toLowerCase();

    ).forEach(

                )
            )

            }

    record
)
{
    const text = `

    .toLowerCase();

    if(
        text.includes(

        );
    }

    if(
        text.includes(

        );

    if(

        )

        );

function normalizeTags(tags){

    if(!tags){
        return [];
    }

    if(Array.isArray(tags)){
        return tags
            .map(t => String(t).trim().toLowerCase())
            .filter(Boolean);
    }

    if(typeof tags === "string"){
        return tags
            .split(",")
            .map(t => t.trim().toLowerCase())
            .filter(Boolean);
    }

    return [];
}

function globalSearch(term){

        term.toLowerCase().trim();

    return globalIndex.filter(item => {

            ${item.category || ""}
            ${item.description || ""}
            ${item.location || ""}
            ${item.country || ""}
            ${item.fileType || ""}
            ${normalizeTags(item.tags)
                .join(" ")}

        `
        .toLowerCase();

        const words =
            term.split(/\s+/);

        return words.every(
            word =>
                searchable.includes(word)
        );

    });

    showKnowledgeExplorer(
        nodeId
    );

}
