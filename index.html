async function buildKnowledgeIndex(){
    console.trace("buildKnowledgeIndex gestart");

    const records =
        await getKnowledgeData();

    if(!Array.isArray(records)){

        console.error(
            "Geen knowledgeData gevonden",
            records
        );

        return;
    }

    const existingKeys =
        new Set(

            globalIndex

            .filter(
                item =>
                    item.source === "knowledge"
            )

            .map(
                item =>
                    `knowledge_${
                        item.id
                    }`
            )

        );

    let addedCount = 0;

    let skippedCount = 0;

    records.forEach(record => {

        const recordId =

            record.id ||

            (
                record.title || ""
            )
            .toLowerCase()
            .trim();

        const uniqueKey =
            `knowledge_${recordId}`;

        if(
            existingKeys.has(
                uniqueKey
            )
        ){

            skippedCount++;

            return;
        }

        existingKeys.add(
            uniqueKey
        );

        const item = {

            source : "knowledge",

            id :
                record.id ||
                Date.now() +
                Math.random(),

            title :
                record.title ||
                "Naamloos document",

            description :
                record.description ||
                "",

            mainCategory :
                record.mainCategory ||
                "Overig",

            subCategory :
                record.subCategory ||
                "Algemeen",

            category :
                record.mainCategory ||
                record.category ||
                "Overig",

            tags :

                Array.isArray(
                    record.tags
                )

                ? record.tags

                : [],

            relationships :

                Array.isArray(
                    record.relationships
                )

                ? record.relationships

                : [],

            language :
                record.language ||
                "NL",

            audience :
                record.audience ||
                "Iedereen",

            type :
                record.type ||
                "artikel",

            fileName :
                record.fileName ||
                "",

            oneDriveId :
                record.oneDriveId ||
                "",

            author :
                record.author ||
                "",

            status :
                record.status ||
                "Actief",

            created :
                record.created ||
                "",

            modified :
                record.modified ||
                "",

            semanticScore :

                (
                    Array.isArray(
                        record.tags
                    )

                    ? record.tags.length

                    : 0
                )

                +

                (
                    Array.isArray(
                        record.relationships
                    )

                    ? record.relationships.length

                    : 0
                ),

            content : "",

            data : record

        };

        globalIndex.push(
            item
        );

        addedCount++;

    });

    console.log(
        "Knowledge records:",
        records.length
    );

    console.log(
        "Toegevoegd:",
        addedCount
    );

    console.log(
        "Overgeslagen duplicaten:",
        skippedCount
    );

    console.log(
        "Knowledge index:",
        globalIndex.filter(
            item =>
                item.source === "knowledge"
        ).length
    );

    console.log(
        "Knowledge categorieën:",
        [
            ...new Set(
                globalIndex
                .filter(
                    item =>
                        item.source === "knowledge"
                )
                .map(
                    item =>
                        item.mainCategory
                )
            )
        ]
    );

}

function linkKnowledgeDocuments(){

    let linked = 0;

    globalIndex
    .filter(
        x => x.source === "knowledge"
    )
    .forEach(knowledge=>{

        let match = null;

        if(knowledge.fileName){

            const fileName =

                knowledge.fileName
                .toLowerCase();

            match = globalIndex.find(file=>

                file.source === "file"

                &&

                file.title
                .toLowerCase()

                .includes(fileName)

            );

        }

        if(!match){

            const titleWords =

                knowledge.title
                .toLowerCase()
                .split(/\s+/)
                .filter(w=>w.length>3);

            match = globalIndex.find(file=>{

                if(file.source !== "file"){

                    return false;

                }

                const name =
                    file.title.toLowerCase();

                return titleWords.every(
                    word =>
                        name.includes(word)
                );

            });

        }

        if(match){

            knowledge.oneDriveId =
                match.id;

            linked++;

        }

    });

    console.log(
        "Knowledge gekoppeld:",
        linked
    );

}

async function scanDriveFolder(
    token,
    folderId,
    path = ""
){

    let results = [];

    try{

        let nextUrl =
            `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children?$top=999`;

        while(nextUrl){

            const response =
                await fetch(
                    nextUrl,
                    {
                        headers:{
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );

            if(!response.ok){

                console.error(
                    "Graph fout:",
                    response.status,
                    response.statusText
                );

                break;
            }

            const data =
                await response.json();

            const items =
                data.value || [];

            for(const item of items){

                const currentPath =
                    path
                        ? `${path}/${item.name}`
                        : item.name;

                const normalizedItem = {

                    id :
                        item.id,

                    name :
                        item.name,

                    fullPath :
                        currentPath,

                    webUrl :
                        item.webUrl || "",

                    size :
                        item.size || 0,

                    folder :
                        item.folder || null,

                    file :
                        item.file || null,

                    package :
                        item.package || null,

                    remoteItem :
                        item.remoteItem || null,

                    shared :
                        item.shared || null,

                    createdDateTime :
                        item.createdDateTime || "",

                    lastModifiedDateTime :
                        item.lastModifiedDateTime || "",

                    childCount :
                        item.folder?.childCount || 0

                };

                results.push(
                    normalizedItem
                );

                /* ==========================
                   Submappen verwerken
                   ========================== */

                if(item.folder){

    const folderSignature =
        item.id;

    if(
        scannedFolderNames.has(
            folderSignature
        )
    ){

        console.log(
            "Map reeds verwerkt:",
            currentPath
        );

        continue;

    }

    scannedFolderNames.set(
        folderSignature,
        currentPath
    );

                    try{

                        const childItems =

                            await scanDriveFolder(

                                token,

                                item.id,

                                currentPath

                            );

                        results.push(
                            ...childItems
                        );

                    }
                    catch(error){

                        console.error(
                            "Submap fout:",
                            currentPath,
                            error
                        );

                    }

                }

            }

            nextUrl =
                data["@odata.nextLink"] || null;

            if(nextUrl){

                console.log(
                    "➡ Volgende pagina..."
                );

            }

        }

        return results;

    }
    catch(error){

        console.error(
            "scanDriveFolder fout:",
            error
        );

        return results;

    }

}

async function getFolderByPath(
    folderName
){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/children",

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const data =
        await response.json();

    const rootFolder =

        (data.value || []).find(

            item =>

                item.folder &&

                item.name === "CCV-VZW"

        );

    if(
        !rootFolder
    ){

        console.error(
            "CCV-VZW niet gevonden"
        );

        return null;

    }

    const childrenResponse =
        await fetch(

            `https://graph.microsoft.com/v1.0/me/drive/items/${rootFolder.id}/children`,

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const childrenData =
        await childrenResponse.json();

    const targetFolder =

        (childrenData.value || []).find(

            item =>

                item.folder &&

                item.name === folderName

        );

    return targetFolder || null;

}

async function loadAssociationFolders() {

    const token = await getAccessToken();

        "https://graph.microsoft.com/v1.0/me/drive/root/children",
        {
            headers:{
                Authorization:"Bearer " + token
            }
        }
    );

    const data = await response.json();

    associationPortals =
        (data.value || [])
        .filter(item => item.folder)
        .filter(item =>

            item.name !== "Documenten" &&
            item.name !== "Kennisbank" &&
            item.name !== "Admin_CCV" &&
            item.name !== "Kasboek"

        );

    return associationPortals;
}

const IndexSettings = {

    keepLatestVersionOnly : true,

    detectVersions : true

};

function chooseNewestVersion(items){

    if(items.length <= 1){

        return items[0];

    }

    return items.sort(

        (a,b)=>

            new Date(
                b.lastModifiedDateTime || 0
            )

            -

            new Date(
                a.lastModifiedDateTime || 0
            )

    )[0];

}

function processDocumentVersions(allItems){

    const groups = {};

    const folders =
        allItems.filter(
            item => item.folder
        );

    const files =
        allItems.filter(
            item => !item.folder
        );

    let keptVersions = 0;
    let removedVersions = 0;

    documentVersions = {};

    files.forEach(item => {

        const signature =

            (
                item.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                item.size || 0
            );

        if(!groups[signature]){

            groups[signature] = [];

        }

        groups[signature].push(
            item
        );

    });

    const filteredFiles = [];

    Object.values(groups)
    .forEach(group => {

        const newest =
            chooseNewestVersion(
                group
            );

        filteredFiles.push(
            newest
        );

        const versionKey =

            (
                newest.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                newest.size || 0
            );

        documentVersions[
            versionKey
        ] =

            group.sort(

                (a,b)=>

                    new Date(
                        b.lastModifiedDateTime || 0
                    )

                    -

                    new Date(
                        a.lastModifiedDateTime || 0
                    )

            );

        if(group.length > 1){

            keptVersions++;

            removedVersions +=
                group.length - 1;

        }

    });

    console.log(
        "VERSIEGROEPEN:",
        keptVersions
    );

    console.log(
        "UITGEFILTERDE VERSIES:",
        removedVersions
    );

    return [

        ...folders,
        ...filteredFiles

    ];

}

            return;

        const titleWords =
            record.title
            .toLowerCase()
            .replace(/[^\w\s]/g," ")
            .split(/\s+/)
            .filter(
                w => w.length > 3

    console.warn(

        fileId,
        response.status
    );

    return "";

}

        const buffer =
            await response.arrayBuffer();

        const pdf =

            await pdfjsLib
            .getDocument({

                data:buffer

            })
            .promise;

        let text = "";

        for(

            let pageNumber = 1;

            pageNumber <= pdf.numPages;

            pageNumber++

        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );

            const content =
                await page.getTextContent();

            text +=

                content.items

                .map(
                    item => item.str
                )

                .join(" ");

        }

        return text;

    }
    catch(error){

        console.error(
            "PDF extract fout",
            error
        );

        return "";

    }

}

        filterBox.value;

        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                item =>
                    item.source === filter
            );

    }

    results.sort((a,b)=>{

        const aTitle =
            (a.title || "")
            .toLowerCase();

        const bTitle =
            (b.title || "")
            .toLowerCase();

        return aTitle.localeCompare(
            bTitle
        );

    });

    renderResults(results);

}

async function filterWebsites(){

    const websites =
        await loadWebsites();

    const search =

        document
            .getElementById(
                "websiteSearch"
            )
            .value
            .toLowerCase();

    const country =

        document
            .getElementById(
                "websiteCountry"
            )
            .value;

        const category =

    document
        .getElementById(
            "websiteCategory"
        )
        .value;

const subCategory =

    document
        .getElementById(
            "websiteSubCategory"
        )
        ?.value || "";

const favoritesOnly =

    document
        .getElementById(
            "favoritesOnly"
        )
        .checked;

    const filtered =

        websites.filter(site => {

            const text =

    `

        ${site.titel || ""}

        ${site.title || ""}

        ${site.land || ""}

        ${site.categorie || ""}

        ${site.subcategorie || ""}

        ${site.beschrijving || ""}

        ${

            Array.isArray(
                site.tags
            )

                ?

            site.tags.join(" ")

                :

            site.tags || ""

        }

    `

    .toLowerCase();

            const searchMatch =

    text.includes(
        search
    );

const countryMatch =

    !country ||

    site.land === country;

const categoryMatch =

    !category ||

    site.subcategorie === category ||

    site.category === category;

const subCategoryMatch =

    !subCategory ||

    site.subcategorie === subCategory;

const favoriteMatch =

    !favoritesOnly ||

    site.favorite === true;

return(

    searchMatch &&

    countryMatch &&

    categoryMatch &&

    subCategoryMatch &&

    favoriteMatch

);

        });

    renderWebsiteList(
        filtered
    );

}

function determineManagementCategory(path){

    const p = (path || "")
        .toLowerCase();

    if(p.includes("ledenbeheer")){
        return "members";
    }

    if(p.includes("projecten")){
        return "projects";
    }

    if(p.includes("vergaderingen")){
        return "meetings";
    }

    if(p.includes("kasboek")){
        return "finance";
    }

    if(p.includes("onkosten")){
        return "finance";
    }

    if(p.includes("post_verzendingen")){
        return "shipping";
    }

    if(p.includes("admin_ccv")){
        return "administration";
    }

    return "";
}

function determineManagementSubCategory(
    path
){

    const parts =
        (path || "")
        .split("/");

    const baseFolders = [

        "ledenbeheer",
        "projecten",
        "vergaderingen",
        "onkosten",
        "kasboek",
        "admin_ccv",
        "post_verzendingen"

    ];

    const matchIndex =

        parts.findIndex(

            part =>

                baseFolders.includes(
                    part.toLowerCase()
                )

        );

    if(
        matchIndex >= 0 &&

        parts.length >
        matchIndex + 1
    ){

        return parts[
            matchIndex + 1
        ];

    }

    return "Algemeen";

}

            );

            "OPEN FILE:",

        );

        const token =
            await getAccessToken();

            await fetch(
                `https://graph.microsoft.com/v1.0/me/drive/items/${realId}`,
                {
                    headers:{
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        if(!response.ok){

            console.error(
                "Bestand niet gevonden",
                response.status
            );

            return;

        }

        const file =
            await response.json();

        console.log(
            "BESTAND:",

        );

        if(file.webUrl){

            window.open(
                file.webUrl,
                "_blank"
            );

        }else{

            alert(
                "Geen OneDrive URL gevonden"
            );

        }

    }
    catch(error){

        console.error(
            "OPEN FILE FOUT",
            error
        );

    }

}

function getKnowledgeMapItems(){

    const sourceFilter =
        document.getElementById(
            "mapSourceFilter"
        )?.value || "all";

    const libraryFilter =
        document.getElementById(
            "mapLibraryFilter"
        )?.value || "all";

    const categoryFilter =
        document.getElementById(
            "mapCategoryFilter"
        )?.value || "all";

    const linkedOnly =
        document.getElementById(
            "linkedOnly"
        )?.checked;

    const relatedOnly =
        document.getElementById(
            "relatedOnly"
        )?.checked;

    const maxNodes =
        parseInt(
            document.getElementById(
                "mapNodeLimit"
            )?.value || 250
        );

    let items = [...globalIndex];

    if(sourceFilter !== "all"){

        items = items.filter(
            item =>
                item.source ===
                sourceFilter
        );

    }

    if(libraryFilter !== "all"){

        items = items.filter(
            item =>
                item.libraryType ===
                libraryFilter
        );

    }

    if(categoryFilter !== "all"){

        items = items.filter(
            item =>
                item.category ===
                categoryFilter
                ||
                item.mainCategory ===
                categoryFilter
        );

    }

    if(linkedOnly){

        items = items.filter(
            item =>
                item.oneDriveId
        );

    }

    if(relatedOnly){

        items = items.filter(
            item =>
                item.relationships &&
                item.relationships.length > 0
        );

    }

    items.sort((a,b)=>{

    const weight = {

        knowledge:1,
        folder:2,
        file:3,
        website:4

    };

    return (
        (weight[a.source] || 99)
        -
        (weight[b.source] || 99)
    );

});

const grouped = {

    knowledge : items.filter(
        x => x.source === "knowledge"
    ),

    file : items.filter(
        x => x.source === "file"
    ),

    folder : items.filter(
        x => x.source === "folder"
    ),

    website : items.filter(
        x => x.source === "website"
    )

};

return [

    ...grouped.knowledge.slice(0,100),

    ...grouped.file.slice(0,800),

    ...grouped.folder.slice(0,200),

    ...grouped.website.slice(0,300)

].slice(0,maxNodes);

}

function buildSemanticRelations(){

    const processedPairs = new Set();

    globalIndex.forEach(item=>{

        item.relationships = [];

    });

    globalIndex.forEach(item=>{

        const tempRelations = [];

        globalIndex.forEach(other=>{

            const sourceId =
                item.source + "_" + item.id;

            const targetId =
                other.source + "_" + other.id;

            /* Zelfde item overslaan */

            if(sourceId === targetId){
                return;
            }

            /* Dubbele combinaties voorkomen */

            const pairKey =
                [sourceId,targetId]
                .sort()
                .join("|");

            if(
                processedPairs.has(
                    pairKey
                )
            ){
                return;
            }

            processedPairs.add(
                pairKey
            );

            /* Alleen Knowledge en Website */

            if(
                (
                    item.source !== "knowledge" &&
                    item.source !== "website"
                )
                ||
                (
                    other.source !== "knowledge" &&
                    other.source !== "website"
                )
            ){
                return;
            }

            const similarity =
                calculateSimilarity(
                    item,
                    other
                );

            const semanticScore =
                calculateContentSimilarity(
                    item,
                    other
                );

            /* Strengere filter */

            const totalScore =
                similarity * 5 +
                semanticScore;

            if(totalScore < 30){
                return;
            }

            tempRelations.push({

                id:other.id,

                source:other.source,

                type:"related",

                automatic:true,

                weight:totalScore

            });

        });

        /* Enkel sterkste relaties bewaren */

        item.relationships =

            tempRelations

            .sort(
                (a,b)=>
                    b.weight - a.weight
            )

            .slice(0,3);

    });

    console.log(
        "Semantische relaties opgebouwd"
    );

}

function buildDocumentConnections(){

    console.log(
    "DocumentConnections:",
    documentConnections
);

    documentConnections = [];

    const existingConnections = new Set();

    globalIndex.forEach(item=>{

        globalIndex.forEach(other=>{

            const sourceId =
                item.source + "_" + item.id;

            const targetId =
                other.source + "_" + other.id;

            /* Zelfde document */

            if(sourceId === targetId){
                return;
            }

            if(item.source !== other.source){
    return;
}

            /* Eén richting */

            if(sourceId > targetId){
                return;
            }

            /* Duplicaten vermijden */

            const connectionKey =
                [sourceId,targetId]
                .sort()
                .join("|");

            if(
                existingConnections.has(
                    connectionKey
                )
            ){
                return;
            }

            const score =
                calculateContentSimilarity(
                    item,
                    other
                );

            /* Veel strenger filter */

          if(
    score <
    minimumRelationScore
){
    return;
}

            existingConnections.add(
                connectionKey
            );

            documentConnections.push({

                source:sourceId,

                target:targetId,

                score:score,

                automatic:true

            });

        });

    });

    /* Sterkste relaties eerst */

    documentConnections.sort(
        (a,b)=>b.score-a.score
    );

    /* Veiligheidslimiet */

    documentConnections =
        documentConnections.slice(
            0,
            150
        );

    console.log(
        "Document connecties:",
        documentConnections.length
    );

}

function getAssociationRelations(

{

        rel =>
            rel.source.includes(
                association
            )
            ||
            rel.target.includes(
                association
            )
    );
}

                edges.push({

                    from:nodeId,

                    to:
                        targetItem.source +
                        "_" +
                        targetItem.id,

                    width:
                        Math.min(
                            rel.weight || 1,
                            10
                        ),

                    color:
                        rel.automatic
                        ? "#4caf50"
                        : "#2196f3"

                });

            }

        });

    });

    documentConnections.forEach(connection=>{

        const edgeKey =

            [
                connection.source,
                connection.target
            ]

            .sort()

            .join("|");

        if(edgeSet.has(edgeKey)){

            return;

        }

        edgeSet.add(edgeKey);

        edges.push({

            from:
                connection.source,

            to:
                connection.target,

            width:
                Math.min(
                    connection.score || 1,
                    8
                ),

            color:"#ff9800",

            dashes:true

        });

    });

    console.log(
        "Nodes:",
        nodes.length
    );

    console.log(
        "Edges:",
        edges.length
    );

    console.log(
        "DocumentConnections:",
        documentConnections.length
    );

    window.knowledgeNetwork =

        new vis.Network(

            document.getElementById(
                "knowledgeNetwork"
            ),

            {

                nodes:
                    new vis.DataSet(
                        nodes
                    ),

                edges:
                    new vis.DataSet(
                        edges
                    )

            },

            {

                layout:{

                    improvedLayout:false

                },

                interaction:{

                    hover:true,

                    navigationButtons:true,

                    multiselect:true

                },

                physics:{

                    enabled:true,

                    stabilization:{

                        enabled:true,

                        iterations:300

                    }

                },

                groups:{

                    knowledge:{
                        color:"#4caf50"
                    },

                    website:{
                        color:"#ff9800"
                    },

                    file:{
                        color:"#2196f3"
                    },

                    folder:{
                        color:"#9c27b0"
                    }

                }

            }

        );

    knowledgeNetwork.once(

        "stabilizationIterationsDone",

        function(){

            knowledgeNetwork.setOptions({

                physics:false

            });

            console.log(
                "VIS gestabiliseerd"
            );

        }

    );

    knowledgeNetwork.on(

        "click",

        params=>{

            if(
                !params.nodes.length
            ){

                return;

            }

            showKnowledgeExplorer(

                params.nodes[0]

            );

        }

    );

}

function createManualRelation(

    sourceNode,

    targetNode

){

    if(
        sourceNode === targetNode
    ){

        return;

    }

    const sourceParts =
        sourceNode.split("_");

    const sourceType =
        sourceParts[0];

    const sourceId =
        sourceParts.slice(1).join("_");

    const sourceItem =

        globalIndex.find(

            item =>

                item.source === sourceType &&

                String(item.id)
                ===
                String(sourceId)

        );

    if(!sourceItem){

        return;

    }

    if(
        !sourceItem.relationships
    ){

        sourceItem.relationships = [];

    }

    sourceItem.relationships.push({

        id:targetNode,

        type:"manual",

        created:
            new Date()
            .toISOString()

    });

    buildKnowledgeNetwork();

}

function calculateSimilarity(
    item,
    other
){

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    return tags1.filter(

        tag =>

            tags2.includes(tag)

    ).length;

}

function calculateContentSimilarity(
    item,
    other
){

    let score = 0;

    const text1 = `

    ${item.title || ""}
    ${item.description || ""}
    ${item.category || ""}
    ${item.content || ""}
    ${normalizeTags(item.tags).join(" ")}

`
.toLowerCase();

const text2 = `

    ${other.title || ""}
    ${other.description || ""}
    ${other.category || ""}
    ${other.content || ""}
    ${normalizeTags(other.tags).join(" ")}

`
.toLowerCase();

    const words1 =

    text1
    .split(/\s+/)
    .filter(Boolean);

const words2 =

    text2
    .split(/\s+/)
    .filter(Boolean);

words1.forEach(word=>{

    if(
        word.length > 2 &&
        words2.includes(word)
    ){

        score++;

    }

});

const key1 =

    documentKeywordIndex[
        item.source +
        "_" +
        item.id
    ] || [];

const key2 =

    documentKeywordIndex[
        other.source +
        "_" +
        other.id
    ] || [];

key1.forEach(keyword=>{

    if(
        key2.includes(keyword)
    ){

        score += 2;

    }

});

    return score;

}

function normalizeTags(tags){

    if(!tags){

        return [];

    }

    if(Array.isArray(tags)){

        return tags
        .map(x=>x.toLowerCase().trim())
        .filter(Boolean);

    }

    return String(tags)

        .split(",")

        .map(x=>x.toLowerCase().trim())

        .filter(Boolean);

}

function globalSearch(term){

    if(!term){

        return globalIndex;
    }

    term =
        term.toLowerCase().trim();

    return globalIndex.filter(item => {

        const searchable = `

            ${item.title || ""}
            ${item.category || ""}
            ${item.description || ""}
            ${item.location || ""}
            ${item.country || ""}
            ${item.fileType || ""}
            ${normalizeTags(item.tags)
                .join(" ")}

        `
        .toLowerCase();

        const words =
            term.split(/\s+/);

        return words.every(
            word =>
                searchable.includes(word)
        );

    });

}

function searchAssociationDocuments(
    associationName,
    text
)
{
    return globalIndex.filter(
        item =>
            item.location &&
            item.location.includes(
                associationName
            ) &&
            JSON.stringify(item)
            .toLowerCase()
            .includes(
                text.toLowerCase()
            )
    );
}

function calculateSemanticScore(item){

    let score = 1;

    score += normalizeTags(
        item.tags
    ).length;

    score +=
        item.relationships
            ? item.relationships.length
            : 0;

    if(item.description){

        score += 2;

    }

    return score;

}

function focusConcept(tag){

    const nodeIds = [];

    globalIndex
.filter(item=>

    item.source === "knowledge" ||

    item.source === "website"

)
.forEach(item=>{

        const tags =

            normalizeTags(
                item.tags
            );

        if(

            tags.includes(

                tag.toLowerCase()

            )

        ){

            nodeIds.push(

                item.source +
                "_" +
                item.id

            );

        }

    });

    if(!nodeIds.length){

        return;

    }

    knowledgeNetwork.selectNodes(
        nodeIds
    );

    knowledgeNetwork.fit({

        nodes:nodeIds,

        animation:true

    });

}

function searchKnowledgeNode(){

    const term =

        document
        .getElementById(
            "knowledgeSearch"
        )
        .value
        .toLowerCase()
        .trim();

    if(!term){

        return;

    }

    const node =

        globalIndex.find(item=>

            JSON.stringify(item)

            .toLowerCase()

            .includes(term)

        );

    if(!node){

        return;

    }

    const nodeId =

        node.source +
        "_" +
        node.id;

    knowledgeNetwork.focus(

        nodeId,

        {

            scale:1.5,

            animation:true

        }

    );

    knowledgeNetwork.selectNodes(
        [nodeId]
    );

    showKnowledgeExplorer(
        nodeId
    );

}
