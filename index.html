async function buildKnowledgeIndex(){

    const records =
        await getKnowledgeData();

    records.forEach(record => {

        globalIndex.push({

    source:
        "knowledge",

    id:
        record.id,

    title:
        record.title || "",

    category:
        record.category || "",

    tags:
        record.tags || [],

    data:
        record

});

    });

}

async function buildOneDriveIndex(){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/search(q='*')",

            {

                headers:{

                    Authorization:
                        "Bearer " + token

                }

            }

        );

    const data =
        await response.json();

    data.value.forEach(item => {

        globalIndex.push({

    source:
        item.folder
            ? "folder"
            : "file",

    id:
        item.id,

    title:
        item.name,

    webUrl:
        item.webUrl,

    location:
        item.parentReference?.path || "",

    modified:
        item.lastModifiedDateTime || "",

    size:
        item.size || 0,

    fileType:
        item.file?.mimeType || "",

    data:
        item
});

    });

}

function globalSearch(term){

    const query =

        term.toLowerCase();

    return globalIndex.filter(item =>

        JSON.stringify(item)

        .toLowerCase()

        .includes(query)

    );

}

                        : "📄"

    ${item.modified || "-"}

async function openSearchResult(
    source,
    id
){

    if(source === "file"){

        openFile(id);
        return;

    }

    if(source === "folder"){

        openDriveItem(id);
        return;

    }

    if(source === "knowledge"){

        const records =
            await getKnowledgeData();

        const record =
            records.find(
                r => String(r.id)
                    === String(id)
            );

        if(!record){

            alert(
                "Record niet gevonden"
            );

            return;

        }

        const fileMatch =
            globalIndex.find(

                item =>

                    item.source === "file" &&

                    item.title &&
                    record.title &&

                    item.title.toLowerCase()
                        ===
                    record.title.toLowerCase()

            );

        if(fileMatch){
console.log(
    "MATCH",
    fileMatch
);
            openFile(
                fileMatch.id
            );

            return;

        }

        alert(
            "Bestand niet gevonden in OneDrive"
        );

    }

}

async function openKnowledgeRecord(id){

    const records =
        await getKnowledgeData();

    const record =
        records.find(
            r => String(r.id) === String(id)
        );

    if(!record){

        alert(
            "Record niet gevonden"
        );

        return;
    }

    const fileMatch =
        globalIndex.find(

            item =>

                item.source === "file" &&

                item.title.toLowerCase() ===
                record.title.toLowerCase()

        );

    if(fileMatch){

        openFile(
            fileMatch.id
        );

        return;
    }

    alert(
        "Bestand niet gevonden in OneDrive-index"
    );

}

function runSearch(){

    const term =

        document

                "globalSearch"

            .value
            .toLowerCase();

    const filter =

        document
            .getElementById(
                "searchFilter"
            )
            .value;

    let results =

        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                r =>
                    r.source === filter
            );

    }

    renderResults(results);

}

function populateCountryFilter(
    websites
){

    const select =

        document.getElementById(
            "websiteCountry"
        );

    const countries =

        [...new Set(

            websites

                .map(
                    w =>
                    w.land || ""
                )

                .filter(Boolean)

        )]

        .sort();

    countries.forEach(country => {

        select.innerHTML += `

            <option value="${country}">

                ${country}

            </option>

        `;

    });

}

function populateCategoryFilter(

        .checked;

    const filtered =

        websites.filter(site => {

            const text =

                JSON.stringify(site)
                .toLowerCase();

            const searchMatch =

    text.includes(
        search
    );

const countryMatch =

    !country ||

    site.land === country;

const categoryMatch =

    !category ||

    site.subcategorie === category ||

    site.category === category;

const favoriteMatch =

    !favoritesOnly ||

    site.favorite === true;

return(

    searchMatch &&

    countryMatch &&

    categoryMatch &&

    favoriteMatch

);

        });

    renderWebsiteList(
        filtered
    );

}

async function createWebsite(){

    const title =

        document
            .getElementById(
                "newWebsiteTitle"
            )
            .value
            .trim();

    const url =

        document
            .getElementById(
                "newWebsiteUrl"
            )
            .value
            .trim();

    const country =

        document
            .getElementById(
                "newWebsiteCountry"
            )
            .value
            .trim();

    if(!title){

        alert(
            "Titel ontbreekt"
        );

        return;

    }

   if(window.currentWebsiteEditId){

    const website =

        websitesCache.find(

            w =>

                String(w.id)
                ===
                String(
                    window.currentWebsiteEditId
                )

        );

    if(website){

        website.titel = title;

        website.url = url;

        website.land = country;

    }

    window.currentWebsiteEditId =
        null;

}
else{

    websitesCache.unshift({

        id:
            Date.now(),

        titel:
            title,

        url:
            url,

        land:
            country,

        categorie:
            "Websites",

        subcategorie:
            "Organisaties",

        tags:[],

        favorite:false,

        created:
            new Date()
            .toISOString()

    });

}

    await saveWebsites();

    renderWebsites();

}

async function deleteWebsite(id){

    const antwoord =

        confirm(
            "Website verwijderen?"
        );

    if(!antwoord){

        return;

    }

    websitesCache =

        websitesCache.filter(

            website =>

        );

    renderWebsites();

function editWebsite(id){

    const website =

        websitesCache.find(

            w =>

                String(w.id)
                ===
                String(id)

        );

    if(!website){

        return;

    }

    document.getElementById(
        "newWebsiteTitle"
    ).value =

        website.titel ||
        website.title ||
        "";

    document.getElementById(
        "newWebsiteUrl"
    ).value =

        website.url || "";

    document.getElementById(
        "newWebsiteCountry"
    ).value =

        website.land || "";

    window.currentWebsiteEditId =
        id;

async function goBack(){

    if(
        folderHistory.length === 0
    ){

        openOneDrive();

        return;

    }

    folderPath.pop();
    if(
    folderPath.length > 0
){

    currentFolderName =

        folderPath[
            folderPath.length - 1
        ].name;

}
else{

    currentFolderName =
        "Hoofdmap";

}

    const previous =

        folderHistory.pop();

    currentFolderId =
        previous;

    if(previous === "root"){

        openOneDrive();

        return;

    }

    const token =
        await getAccessToken();

    const response =
        await fetch(

        `https://graph.microsoft.com/v1.0/me/drive/items/${previous}/children`,

        {

            headers:{

                Authorization:
                    "Bearer " + token

            }

        }

    );

    const data =
        await response.json();

    currentItems =
        data.value || [];

    document.getElementById(
        "ccvContent"
    ).innerHTML = `

        <div class="page-title">

            📁 ${currentFolderName}

        </div>

        <div
    style="
        margin-bottom:15px;
        color:#666;
        font-size:14px;
    "
>

    ${folderPath
        .map(
            p => p.name
        )
        .join(" > ")}

</div>

        <div class="card">
          
            <input

    id="searchBox"

    type="text"

    placeholder="Zoek in deze map..."

    onkeyup="searchFolder()"

    style="
        width:100%;
        padding:10px;
        margin-bottom:15px;
    "

>

            <button
                onclick="goRoot()"
            >
                🏠 Hoofdmap
            </button>

           <button
    onclick="goBack()"
>
    ⬅ Vorige map
</button>

            <br><br>

            ${renderFolderItems(
                currentItems
            )}

        </div>

    `;

}

function renderFolderItems(items){

    return items.map(item => {

        if(item.folder){

            return `

                <div
                    style="
                        padding:12px;
                        border-bottom:1px solid #ddd;
                        cursor:pointer;
                    "
                    onclick="
                        openDriveItem(
                            '${item.id}',
                            '${item.name}'
                        )
                    "
                >

                    📁 ${item.name}

                </div>

            `;

        }

        return `

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:12px;
                    border-bottom:1px solid #ddd;
                "
            >

                <span
                    onclick="
                        openFile(
                            '${item.id}'
                        )
                    "
                    style="
                        cursor:pointer;
                        flex:1;
                    "
                >

                    📄 ${item.name}

                </span>

                <button
                    onclick="
                        event.stopPropagation();
                        showFile(
                            '${item.id}'
                        );
                    "
                >

                    ℹ️

                </button>

            </div>

        `;

    }).join("");

}
