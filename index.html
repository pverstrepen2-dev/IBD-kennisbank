function buildSemanticRelations(){

    console.log(
        "Semantische relaties opbouwen..."
    );

RelationshipEngine.buildAll();

    const processedPairs =
        new Set();

    let itemsWithRelations = 0;

    globalIndex.forEach(item=>{

        const manualRelations =

    (item.relationships || [])

    .filter(
        rel =>
            rel.type === "manual"
    );

item.relationships =
    [...manualRelations];

    });

    globalIndex.forEach(item=>{

        const itemId =
            item.source +
            "_" +
            item.id;

        const itemKeywords =
            documentKeywordIndex[
                itemId
            ] || [];

        if(
            itemKeywords.length === 0
        ){
            return;
        }

        const candidateIds =
            new Set();

        itemKeywords.forEach(keyword=>{

            const matchingDocs =
                keywordToDocuments[
                    keyword
                ] || [];

            if(
                matchingDocs.length > 50
            ){
                return;
            }

            matchingDocs.forEach(docId=>{

                if(docId !== itemId){

                    candidateIds.add(
                        docId
                    );

                }

            });

        });

        const tempRelations = [];

        candidateIds.forEach(candidateId=>{

            const other =
                globalIndexMap[
                    candidateId
                ];

            if(!other){
                return;
            }

            if(
                item.source === "folder" ||
                other.source === "folder"
            ){
                return;
            }

            const sourceId =
                itemId;

            const targetId =
                candidateId;

            const pairKey =
                [
                    sourceId,
                    targetId
                ]
                .sort()
                .join("|");

            if(
                processedPairs.has(
                    pairKey
                )
            ){
                return;
            }

            processedPairs.add(
                pairKey
            );

            const similarity =
                calculateSimilarity(
                    item,
                    other
                );

            if(similarity === 0){
    return;
}

            const semanticScore =
                calculateContentSimilarity(
                    item,
                    other
                );

            const totalScore =
                similarity * 5 +
                semanticScore;

            if(totalScore < 10){
                return;
            }

            tempRelations.push({

                id:
                    other.id,

                source:
                    other.source,

                type:
                    "related",

                automatic:
                    true,

                weight:
                    totalScore

            });

        });

        const existing =
    item.relationships || [];

const existingKeys =
    new Set(
        existing.map(
            rel =>
                `${rel.source}_${rel.id}`
        )
    );

tempRelations.forEach(rel =>
{
    const key =
        `${rel.source}_${rel.id}`;

    if(!existingKeys.has(key))
    {
        existing.push(rel);
    }
});

item.relationships =
    existing
        .sort(
            (a,b) =>
                b.weight - a.weight
        )
        .slice(0,20);

        if(
            item.relationships.length
        ){
            itemsWithRelations++;
        }

    });

    semanticConnectionsBuilt =
        true;

    console.log(
        "Items met relaties:",
        itemsWithRelations
    );

    console.log(
        "Semantische relaties opgebouwd"
    );

}

function buildDocumentConnections(){

    documentConnections = [];

    const processedPairs =
        new Set();

    const createdConnections =
        new Map();

    Object.entries(
        keywordToDocuments
    ).forEach(

        ([keyword, docs])=>{

            if(
                docs.length < 2
            ){
                return;
            }

            if(
                docs.length > 100
            ){
                return;
            }

            for(
                let i = 0;
                i < docs.length;
                i++
            ){

                for(
                    let j = i + 1;
                    j < docs.length;
                    j++
                ){

                    const source =
                        docs[i];

                    const target =
                        docs[j];

                    const pairKey =
                        [source,target]
                        .sort()
                        .join("|");

                    if(
                        processedPairs.has(
                            pairKey
                        )
                    ){
                        continue;
                    }

                    processedPairs.add(
                        pairKey
                    );

                    const sourceItem =
    globalIndexMap[source];

const targetItem =
    globalIndexMap[target];

                    if(
                        !sourceItem ||
                        !targetItem
                    ){
                        continue;
                    }

                    const score =
                        calculateContentSimilarity(
                            sourceItem,
                            targetItem
                        );

                    if(
                        score <
                        minimumRelationScore
                    ){
                        continue;
                    }

                    createdConnections.set(
                        pairKey,
                        {
                            source,
                            target,
                            score,
                            automatic:true
                        }
                    );

                }

            }

        }

    );

    documentConnections =
        [...createdConnections.values()]
        .sort(
            (a,b)=>
                b.score - a.score
        )
        .slice(0,250);

    console.log(
        "Document connecties:",
        documentConnections.length
    );

}

            )
    );

        buildDocumentConnections();

        buildSemanticRelations();

    }

    buildConceptClusters();

    const nodes = [];

    visibleItems.forEach(item=>{

            item.source +

async function createManualRelation(
    sourceNode,
    targetNode
)
{
    if(sourceNode === targetNode){
        return;
    }

    const sourceParts =
        sourceNode.split("_");

    const sourceType =
        sourceParts[0];

    const sourceId =
        sourceParts.slice(1).join("_");

    const targetParts =
        targetNode.split("_");

    const targetSource =
        targetParts[0];

    const targetId =
        targetParts.slice(1).join("_");

    const sourceItem =
        globalIndex.find(
            item =>
                item.source === sourceType &&
                String(item.id) === String(sourceId)
        );

    if(!sourceItem){
        return;
    }

    if(!sourceItem.relationships){
        sourceItem.relationships = [];
    }

    const exists =
        sourceItem.relationships.some(
            rel =>
                String(rel.id) === String(targetId) &&
                rel.source === targetSource
        );

    if(exists){

        alert(
            "Relatie bestaat al"
        );

        return;
    }

    sourceItem.relationships.push({

        id : targetId,

        source : targetSource,

        type : "manual",

        weight : 100,

        created :
            new Date().toISOString()

    });

    await buildKnowledgeNetwork();
}

function calculateSimilarity(
    item,
    other
){

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    return tags1.filter(

        tag =>

            tags2.includes(tag)

    ).length;

}

function calculateContentSimilarity(
    item,
    other
){

    const itemId =
        item.source +
        "_" +
        item.id;

    const otherId =
        other.source +
        "_" +
        other.id;

    const keywords1 =
        documentWordIndex[itemId];

    const keywords2 =
        documentWordIndex[otherId];

    if(
        !keywords1 ||
        !keywords2
    ){
        return 0;
    }

    let score = 0;

    const smallest =
        keywords1.size <
        keywords2.size
            ? keywords1
            : keywords2;

    const largest =
        keywords1.size <
        keywords2.size
            ? keywords2
            : keywords1;

    smallest.forEach(word=>{

        if(
            largest.has(word)
        ){
            score += 2;
        }

    });

    const tags1 =
        normalizeTags(
            item.tags
        );

    const tags2 =
        normalizeTags(
            other.tags
        );

    tags1.forEach(tag=>{

        if(
            tags2.includes(tag)
        ){
            score += 5;
        }

    });

    if(
        item.category &&
        other.category &&
        item.category === other.category
    ){
        score += 3;
    }

    if(
        item.mainCategory &&
        other.mainCategory &&
        item.mainCategory ===
        other.mainCategory
    ){
        score += 5;
    }

    return score;

}

    const text = `

    .toLowerCase();

    const detected = {

        symptoms : [],

        complications : [],
        diagnostics : [],
        aiTags : []

    };

    Object.entries(
        TAXONOMY_RULES
    ).forEach(

        ([field, keywords]) =>
        {

            if(
    keywords.some(
        keyword =>
            containsWord(
                text,
                keyword
            )
    )
)
{
    detected[field] = true;
}

        }

    );

    return detected;
}

    if(
        text.includes("crp")
        ||
        text.includes("ferritine")
        ||
        text.includes("hemoglobine")
        ||
        text.includes("calprotectine")
        ||
        text.includes("crohn")
        ||
        text.includes("colitis")
    )
    {
        return "health";
    }

    if(
        text.includes("richtlijn")
        ||
        text.includes("ecco")
        ||
        text.includes("studie")
        ||
        text.includes("onderzoek")
    )
    {
        return "knowledge";
    }

    return "general";

function globalSearch(term){

    if(!term){

        return globalIndex;
    }

    term =
        term.toLowerCase().trim();

    return globalIndex.filter(item => {

        const searchable = `

            ${item.title || ""}
            ${item.category || ""}
            ${item.description || ""}
            ${item.location || ""}
            ${item.country || ""}
            ${item.fileType || ""}
            ${normalizeTags(item.tags)
                .join(" ")}

        `
        .toLowerCase();

        const words =
            term.split(/\s+/);

        return words.every(
            word =>
                searchable.includes(word)
        );

    });

}

    let score = 1;

score +=

score +=

score +=
    item.taxonomy?.symptoms?.length || 0;

score +=
    item.taxonomy?.medication?.length || 0;

score +=
    item.taxonomy?.complications?.length || 0;

    score += normalizeTags(
        item.tags
    ).length;

    score +=
        item.relationships
            ? item.relationships.length
            : 0;
