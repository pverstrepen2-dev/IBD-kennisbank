async function extractBloodValuesFromPDF(file) {

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
        data: arrayBuffer
    }).promise;

    let fullText = "";

    for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {

        const page = await pdf.getPage(pageNum);

        const textContent = await page.getTextContent();

        const pageText = textContent.items
            .map(item => item.str)
            .join(" ");

        fullText += pageText + "\n";
    }

    console.log("PDF BLOEDTEKST", fullText);

    return parseBloodValues(fullText);
}

function addToIndexService(item){

    const key =
        item.source +
        "_" +
        item.id;

    IndexService.byId[key] = item;

    if(!IndexService.bySource[item.source]){
        IndexService.bySource[item.source] = [];
    }

    IndexService.bySource[item.source].push(item);

    if(item.associationName){

        if(
            !IndexService.byAssociation[
                item.associationName
            ]
        ){
            IndexService.byAssociation[
                item.associationName
            ] = [];
        }

        IndexService.byAssociation[
            item.associationName
        ].push(item);

    }

    const category =
        item.managementCategory ||
        item.mainCategory ||
        item.category;

    if(category){

        if(
            !IndexService.byCategory[
                category
            ]
        ){
            IndexService.byCategory[
                category
            ] = [];
        }

        IndexService.byCategory[
            category
        ].push(item);

    }

}

async function getAccessToken()
{
    const accounts =
        msalInstance.getAllAccounts();

    if(!accounts.length)
    {
        console.warn(
            "Geen Microsoft-account gevonden"
        );

        return null;
    }

    availableAccounts =
        accounts;

    const account =
        currentCalendarAccount
        ||
        accounts[0];

    try
    {
        const response =
            await msalInstance.acquireTokenSilent({

                account,

                scopes:[

                    "User.Read",

                    "Files.ReadWrite",

                    "Mail.Read",

                    "Calendars.Read",

                    "Calendars.ReadWrite"

                ]

            });

        return response.accessToken;
    }
    catch(error)
    {
        console.error(
            "Token fout:",
            error
        );

        return null;
    }
}

            records
        );

        return;
    }

    const existingKeys =
        new Set(

            globalIndex

            .filter(
                item =>
                    item.source === "knowledge"

            .map(
                item =>
                    `knowledge_${
                        item.id

function linkKnowledgeDocuments(){

    globalIndex
    .filter(
        x => x.source === "knowledge"
    )
    .forEach(knowledge=>{

        let match = null;

        if(knowledge.fileName){

            const fileName =

                knowledge.fileName
                .toLowerCase();

            match = globalIndex.find(file=>

                file.source === "file"

                &&

                file.title
                .toLowerCase()

                .includes(fileName)

            );

        }

        if(!match){

            const titleWords =

                knowledge.title
                .toLowerCase()
                .split(/\s+/)
                .filter(w=>w.length>3);

            match = globalIndex.find(file=>{

                if(file.source !== "file"){

                    return false;

                }

                const name =
                    file.title.toLowerCase();

                return titleWords.every(
                    word =>
                        name.includes(word)
                );

            });

        }

        if(match){

            knowledge.oneDriveId =
                match.id;

            linked++;

        }

    });

    console.log(
        "Knowledge gekoppeld:",
        linked
    );

}

function analyzeHealthData()
{
    const health =
        DatabaseService.cache?.healthData || {};

    const blood =
        health.bloodResults || [];

    const sleep =
        health.sleepEntries || [];

    const stress =
        health.stressEntries || [];

    const insights = [];

    if(blood.length >= 2)
    {
        const latest = blood[0];
        const previous = blood[1];

        // CRP trend

        const currentCRP =
            Number(latest.values?.CRP || 0);

        const previousCRP =
            Number(previous.values?.CRP || 0);

        if(currentCRP > previousCRP)
        {
            insights.push({
                type : "warning",
                category : "CRP",
                text :
                `CRP stijgt van ${previousCRP}
                 naar ${currentCRP}`
            });
        }

        // Ferritine trend

        const currentFerritine =
            Number(
                latest.values?.Ferritine || 0
            );

        const previousFerritine =
            Number(
                previous.values?.Ferritine || 0
            );

        if(
            currentFerritine <
            previousFerritine
        )
        {
            insights.push({
                type : "warning",
                category : "Ferritine",
                text :
                `Ferritine daalt van
                ${previousFerritine}
                naar
                ${currentFerritine}`
            });
        }
    }

    return insights;
}

function extractHref(html)
{
    if(!html)
    {
        return "";
    }

    const match =
        String(html).match(
            /href="([^"]+)"/i
        );

    if(match)
    {
        return match[1];
    }

    return String(html);
}

function extractHref(value)
{
    if(!value)
    {
        return "";
    }

    const hrefMatch =
        String(value).match(
            /href="([^"]+)"/i
        );

    if(hrefMatch)
    {
        return hrefMatch[1];
    }

    return String(value);
}

async function scanDriveFolder(
    token,
    folderId,
    path = ""
){

    let results = [];

    try{

        let nextUrl =
            `https://graph.microsoft.com/v1.0/me/drive/items/${folderId}/children?$top=999`;

        while(nextUrl){

            const response =
                await fetch(
                    nextUrl,
                    {
                        headers:{
                            Authorization:
                                "Bearer " + token
                        }
                    }
                );

            if(!response.ok){

                console.error(
                    "Graph fout:",
                    response.status,
                    response.statusText
                );

                break;
            }

            const data =
                await response.json();
        
            const items =
                data.value || [];

            for(const item of items){

                const currentPath =
                    path
                        ? `${path}/${item.name}`
                        : item.name;

                const normalizedItem = {

    id :
        item.id,

    name :
        item.name,

    fullPath :
        currentPath,

    webUrl :
        extractHref(
            item.webUrl
        ),

    downloadUrl :
        item["@microsoft.graph.downloadUrl"] || "",

                    size :
                        item.size || 0,

                    folder :
                        item.folder || null,

                    file :
                        item.file || null,

                    package :
                        item.package || null,

                    remoteItem :
                        item.remoteItem || null,

                    shared :
                        item.shared || null,

                    createdDateTime :
                        item.createdDateTime || "",

                    lastModifiedDateTime :
                        item.lastModifiedDateTime || "",

                    childCount :
                        item.folder?.childCount || 0

                };

                results.push(
                    normalizedItem
                );

                /* ==========================
                   Submappen verwerken
                   ========================== */

                if(item.folder){

    const folderSignature =
        item.id;

    if(
        scannedFolderNames.has(
            folderSignature
        )
    ){

        console.log(
            "Map reeds verwerkt:",
            currentPath
        );

        continue;

    }

    scannedFolderNames.set(
        folderSignature,
        currentPath
    );

                    try{

                        const childItems =

                            await scanDriveFolder(

                                token,

                                item.id,

                                currentPath

                            );

                        results.push(
                            ...childItems
                        );

                    }
                    catch(error){

                        console.error(
                            "Submap fout:",
                            currentPath,
                            error
                        );

                    }

                }

            }

            nextUrl =
                data["@odata.nextLink"] || null;

            if(nextUrl){

                console.log(
                    "➡ Volgende pagina..."
                );

            }

        }

        return results;

    }
    catch(error){

        console.error(
            "scanDriveFolder fout:",
            error
        );

        return results;

    }

}

async function getFolderByPath(
    folderName
){

    const token =
        await getAccessToken();

    const response =
        await fetch(

            "https://graph.microsoft.com/v1.0/me/drive/root/children",

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const data =
        await response.json();

    const rootFolder =

        (data.value || []).find(

            item =>

                item.folder &&

                item.name === "CCV-VZW"

        );

    if(
        !rootFolder
    ){

        console.error(
            "CCV-VZW niet gevonden"
        );

        return null;

    }

    const childrenResponse =
        await fetch(

            `https://graph.microsoft.com/v1.0/me/drive/items/${rootFolder.id}/children`,

            {
                headers:{
                    Authorization:
                        "Bearer " + token
                }
            }

        );

    const childrenData =
        await childrenResponse.json();

    const targetFolder =

        (childrenData.value || []).find(

            item =>

                item.folder &&

                item.name === folderName

        );

    return targetFolder || null;

}

){
    const association =
        associationName.toLowerCase();

    const documents =
        getAssociationDocuments(
            associationName
        );

    const websites =
        websitesCache.filter(site => {

            const text = `

                ${site.association || ""}
                ${site.organization || ""}
                ${site.title || ""}
                ${site.titel || ""}

            `
            .toLowerCase();

            return text.includes(
                association
            );

        });

    const captures =
        (
            databaseCache?.quickCaptures
            || []
        )
        .filter(capture =>

            (
                capture.organization ||
                ""
            )
            .toLowerCase()
            === association

        );

    const emails =
        globalIndex.filter(item => {

            if(item.source !== "email"){
                return false;
            }

            const text = `

                ${item.title || ""}
                ${item.description || ""}
                ${item.sender || ""}

            `
            .toLowerCase();

            return text.includes(
                association
            );

        });

    return {

        documents,
        websites,
        captures,
        emails

    };
}

function scoreAssociationItem(item, question)
{
    const words =
        question
        .toLowerCase()
        .split(/\s+/)
        .filter(word => word.length > 2);

    const text = `
        ${item.title || ""}
        ${item.description || ""}
        ${item.content || ""}
        ${item.location || ""}
        ${item.sender || ""}
        ${item.category || ""}
        ${normalizeTags(item.tags).join(" ")}
    `
    .toLowerCase();

    let score = 0;

    words.forEach(word =>
    {
        if(text.includes(word))
        {
            score += 10;
        }
    });

    score += calculateSemanticScore(item);

    return score;
}

function getAssociationContext(
    associationName,
    question
)
{
    const association =
        associationName.toLowerCase();

    const documents =
        getAssociationDocuments(
            associationName
        );

    const captures =
        (
            DatabaseService.cache
            ?.quickCaptures || []
        )
        .filter(item =>
            (
                item.organization || ""
            )
            .toLowerCase()
            === association
        );

    const websites =
        websitesCache.filter(site =>
        {
            const text = `
                ${site.association || ""}
                ${site.organization || ""}
                ${site.title || ""}
            `
            .toLowerCase();

            return text.includes(
                association
            );
        });

    const emails =
        globalIndex.filter(item =>
        {
            if(item.source !== "email")
            {
                return false;
            }

            const text = `
                ${item.title || ""}
                ${item.description || ""}
                ${item.sender || ""}
            `
            .toLowerCase();

            return text.includes(
                association
            );
        });

    const allResults = [

        ...documents,

        ...captures.map(c => ({
            ...c,
            source : "capture"
        })),

        ...websites.map(w => ({
            ...w,
            source : "website"
        })),

        ...emails

    ];

    return allResults
        .map(item =>
        ({
            item,
            score :
                scoreAssociationItem(
                    item,
                    question
                )
        }))
        .sort(
            (a,b) =>
                b.score - a.score
        )
        .slice(0,25);
}

function rankKnowledgeResults(
    question,
    items
)
{
    const words =
        question
        .toLowerCase()
        .split(/\s+/)
        .filter(
            word =>
                word.length > 2
        );

    return items
        .map(item =>
        {
            let score = 0;

            const text = `
                ${item.title || ""}
                ${item.description || ""}
                ${item.content || ""}
                ${item.location || ""}
                ${normalizeTags(item.tags).join(" ")}
            `
            .toLowerCase();

            words.forEach(word =>
            {
                if(
                    text.includes(word)
                )
                {
                    score += 10;
                }
            });

            const title =
                (
                    item.title || ""
                )
                .toLowerCase();

            words.forEach(word =>
            {
                if(
                    title.includes(word)
                )
                {
                    score += 25;
                }
            });

            score +=
                calculateSemanticScore(
                    item
                );

            return {
                item,
                score
            };
        })
        .sort(
            (a,b) =>
                b.score - a.score
        );
}

function buildAISummary(
    question,
    results
)
{
    const top =
        results.slice(0,10);

    let summary = [];

    summary.push(
        `Vraag: ${question}`
    );

    summary.push("");

    summary.push(
        `Ik vond ${top.length} relevante bronnen.`
    );

    summary.push("");

    top.forEach(result =>
    {
        const item =
            result.item;

        summary.push(

            `• ${
                item.title
            }`

        );

        if(item.description)
        {
            summary.push(
                item.description
                    .substring(
                        0,
                        200
                    )
            );
        }

        summary.push("");
    });

    return summary.join("\n");
}

    }

    )
    {
        category =
            "Richtlijnen";

        subCategory =
            "ECCO";

        aiTags.add(
            "ECCO"
        );
    }

    if(
        text.includes("research") ||
        text.includes("study") ||
        text.includes("onderzoek")
    )
    {
        category =
            "Onderzoek";

        subCategory =
            "Studies";

        aiTags.add(
            "Onderzoek"
        );
    }

    let audience = [];

let contentType =
    "Artikel";

const taxonomy =
{
    crohn:false,
    colitis:false,
    voeding:false,
    stress:false,
    medicatie:false,
    onderzoek:false,
    richtlijnen:false
};

if(
    text.includes("crohn")
)
{
    taxonomy.crohn = true;
}

if(
    text.includes("colitis")
)
{
    taxonomy.colitis = true;
}

if(
    text.includes("voeding")
)
{
    taxonomy.voeding = true;
}

if(
    text.includes("stress")
)
{
    taxonomy.stress = true;
}

if(
    text.includes("medicatie")
    ||
    text.includes("biologic")
    ||
    text.includes("ustekinumab")
    ||
    text.includes("vedolizumab")
)
{
    taxonomy.medicatie = true;
}

if(
    text.includes("research")
    ||
    text.includes("study")
    ||
    text.includes("onderzoek")
)
{
    taxonomy.onderzoek = true;

    contentType =
        "Research";
}

if(
    text.includes("ecco")
    ||
    text.includes("guideline")
)
{
    taxonomy.richtlijnen = true;

    contentType =
        "Richtlijn";
}

if(
    text.includes("patient")
    ||
    text.includes("patiënt")
)
{
    audience.push(
        "Patiënten"
    );
}

if(
    text.includes("physician")
    ||
    text.includes("gastro")
    ||
    text.includes("zorgverlener")
)
{
    audience.push(
        "Zorgverleners"
    );
}

return {

    category,

    subCategory,

    tags:
        Array.from(
            aiTags
        ),

    summary:
        (
            description || ""
        ).substring(
            0,
            250
        ),

    audience,

    contentType,

    taxonomy

};
}

function getCaptureCategoryStats(
    captures
)
{
    const stats = {};

    captures.forEach(
        capture =>
        {
            const category =
                capture.aiCategory ||
                "Algemeen";

            stats[category] =
                (
                    stats[category] || 0
                ) + 1;
        }
    );

    return stats;
}

async function renderAssociationCaptures(

        await DatabaseService.load();

                ===
                associationName.toLowerCase()

            (a,b) =>
                new Date(
                    b.publicationDate ||
                    b.createdDate ||

                    a.publicationDate ||
                    a.createdDate ||
                    0
                )
        );

function findRelatedCaptures(
    capture,
    allCaptures
)
{
    return allCaptures

        .filter(
            x =>
                x.id !== capture.id
        )

        .map(
            x =>
            {
                let score = 0;

                if(
                    x.aiCategory ===
                    capture.aiCategory
                )
                {
                    score += 5;
                }

                if(
                    x.aiSubCategory ===
                    capture.aiSubCategory
                )
                {
                    score += 3;
                }

                (x.aiTags || [])
                .forEach(tag =>
                {
                    if(
                        (
                            capture.aiTags ||
                            []
                        ).includes(tag)
                    )
                    {
                        score += 2;
                    }
                });

                return {
                    capture:x,
                    score
                };
            }
        )

        .filter(
            x => x.score > 0
        )

        .sort(
            (a,b) =>
                b.score - a.score
        )

        .slice(0,5)

        .map(
            x => x.capture
        );
}

async function openCaptureAttachment(
    captureId
)
{
    const db =
        await DatabaseService.load();

    const capture =
        (
            db.quickCaptures || []
        ).find(
            x =>
                String(x.id)
                ===
                String(captureId)
        );

    if(
        !capture ||
        !capture.attachmentContent
    )
    {
        alert(
            "Geen bijlage gevonden."
        );
        return;
    }

    try
    {
        const response =
            await fetch(
                capture.attachmentContent
            );

        const blob =
            await response.blob();

        const blobUrl =
            URL.createObjectURL(
                blob
            );

        const link =
            document.createElement(
                "a"
            );

        link.href =
            blobUrl;

        link.download =
            capture.attachmentName
            || "document.pdf";

        document.body.appendChild(
            link
        );

        link.click();

        document.body.removeChild(
            link
        );

        setTimeout(
            () =>
            {
                URL.revokeObjectURL(
                    blobUrl
                );
            },
            3000
        );
    }
    catch(error)
    {
        console.error(
            error
        );

        alert(
            "Download mislukt."
        );
    }
}

        const pageLabel =

    keepLatestVersionOnly : true,

    detectVersions : true

};

function chooseNewestVersion(items){

    if(items.length <= 1){

        return items[0];

    }

    return items.sort(

        (a,b)=>

            new Date(
                b.lastModifiedDateTime || 0
            )

            -

            new Date(
                a.lastModifiedDateTime || 0
            )

    )[0];

}

function processDocumentVersions(allItems){

    const groups = {};

    const folders =
        allItems.filter(
            item => item.folder
        );

    const files =
        allItems.filter(
            item => !item.folder
        );

    let keptVersions = 0;
    let removedVersions = 0;

    documentVersions = {};

    files.forEach(item => {

        const signature =

            (
                item.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                item.size || 0
            );

        if(!groups[signature]){

            groups[signature] = [];

        }

        groups[signature].push(
            item
        );

    });

    const filteredFiles = [];

    Object.values(groups)
    .forEach(group => {

        const newest =
            chooseNewestVersion(
                group
            );

        filteredFiles.push(
            newest
        );

        const versionKey =

            (
                newest.name || ""
            )
            .toLowerCase()
            .trim()

            +

            "|"

            +

            (
                newest.size || 0
            );

        documentVersions[
            versionKey
        ] =

            group.sort(

                (a,b)=>

                    new Date(
                        b.lastModifiedDateTime || 0
                    )

                    -

                    new Date(
                        a.lastModifiedDateTime || 0
                    )

            );

        if(group.length > 1){

            keptVersions++;

            removedVersions +=
                group.length - 1;

        }

    });

    console.log(
        "VERSIEGROEPEN:",
        keptVersions
    );

    console.log(
        "UITGEFILTERDE VERSIES:",
        removedVersions
    );

    return [

        ...folders,
        ...filteredFiles

    ];

}

function autoLinkKnowledgeFiles(){

    const files =
        globalIndex.filter(
            x => x.source === "file"
        );

    let linked = 0;

    databaseCache.knowledgeData.forEach(record=>{

        if(record.fileName){
            return;
        }

        const titleWords =
            record.title
            .toLowerCase()
            .replace(/[^\w\s]/g," ")
            .split(/\s+/)
            .filter(
                w => w.length > 3
            );

        const match = files.find(file=>{

            const fileName =
                file.title.toLowerCase();

            const score =
                titleWords.filter(
                    word =>
                        fileName.includes(word)
                ).length;

            return score >= 2;

        });

        if(match){

            record.fileName =
                match.title;

            linked++;

            console.log(
                "Gekoppeld:",
                record.title,
                "=>",
                match.title
            );

        }

    });

    console.log(
        "Automatische koppelingen:",
        linked
    );

async function extractPdfContent(fileId){

    try{

        const token =
            await getAccessToken();

        const response =
            await fetch(

                `https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`,

                {

                    headers:{

                        Authorization:
                            "Bearer " + token

                    }

                }

            );
        if(!response.ok){

    console.warn(
        "PDF niet leesbaar:",
        fileId,
        response.status
    );

    return "";

}

        const buffer =
            await response.arrayBuffer();

        const pdf =

            await pdfjsLib
            .getDocument({

                data:buffer

            })
            .promise;

        let text = "";

        for(

            let pageNumber = 1;

            pageNumber <= pdf.numPages;

            pageNumber++

        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );

            const content =
                await page.getTextContent();

            text +=

                content.items

                .map(
                    item => item.str
                )

                .join(" ");

        }

        return text;

    }
    catch(error){

        console.error(
            "PDF extract fout",
            error
        );

        return "";

    }

}

async function extractDocumentContent(
    item
)
{
    const mime =

            ""

        .toLowerCase();

    if(

    return "";

function runSearch(){

    const searchBox =
        document.getElementById(
            "globalSearch"
        );

    const filterBox =
        document.getElementById(
            "searchFilter"
        );

    if(
        !searchBox ||
        !filterBox
    ){
        return;
    }

    const term =
        searchBox.value
        .trim()
        .toLowerCase();

    const filter =
        filterBox.value;

    let results =
        globalSearch(term);

    if(filter !== "all"){

        results =
            results.filter(
                item =>
                    item.source === filter
            );

    }

    results.sort((a,b)=>{

        const aTitle =
            (a.title || "")
            .toLowerCase();

        const bTitle =
            (b.title || "")
            .toLowerCase();

        return aTitle.localeCompare(
            bTitle
        );

    });

    renderResults(results);

}

function drawMentalHealthChart()
{
    if(typeof Chart === "undefined")
    {
        console.warn(
            "Chart.js niet geladen"
        );

        return;
    }

    const history =
        DatabaseService.cache
        ?.healthData
        ?.mentalHealthAssessments || [];

    if(!history.length)
    {
        return;
    }

    const data =
        history
        .slice()
        .reverse();

    const labels =
        data.map(
            item =>
                new Date(item.date)
                .toLocaleDateString(
                    "nl-BE"
                )
        );

    const who5Data =
        data.map(
            item =>
                item.who5 || 0
        );

    const gad7Data =
        data.map(
            item =>
                item.gad7 || 0
        );

    const phq9Data =
        data.map(
            item =>
                item.phq9 || 0
        );

    const mentalIndexData =
        data.map(
            item =>
                item.mentalIndex || 0
        );

    if(
        HealthCharts.mentalHealth
    )
    {
        HealthCharts
        .mentalHealth
        .destroy();
    }

    const canvas =
        document.getElementById(
            "mentalHealthChart"
        );

    if(!canvas)
    {
        return;
    }

    HealthCharts.mentalHealth =
        new Chart(
            canvas,
            {

                type : "line",

                data :
                {
                    labels,

                    datasets :
                    [

                        {
                            label :
                                "WHO-5",

                            data :
                                who5Data,

                            borderColor :
                                "#16a34a",

                            backgroundColor :
                                "#16a34a22",

                        },

                        {
                            label :
                                "GAD-7",

                            data :
                                gad7Data,

                            borderColor :
                                "#ca8a04",

                            backgroundColor :
                                "#ca8a0422",

                            tension : 0.3
                        },

                        {
                            label :
                                "PHQ-9",

                            data :
                                phq9Data,

                            borderColor :
                                "#dc2626",

                            backgroundColor :
                                "#dc262622",

                            tension : 0.3
                        },

                        {
                            label :
                                "Mentale Index",

                            data :
                                mentalIndexData,

                            borderColor :
                                "#2563eb",

                            backgroundColor :
                                "#2563eb22",

                            borderWidth : 3,

                            tension : 0.3
                        }

                },

                options :
                {
                    responsive : true,

                    maintainAspectRatio : false,

                    plugins :

function calculateDiseaseActivity()
{
    const health =
        DatabaseService.cache
        ?.healthData || {};

    const latestBlood =
        health.bloodResults?.[0];

    const latestCal =
        health.calprotectineResults?.[0];

    if(!latestBlood)
    {
        return {
            level :
                "Onvoldoende data",
            color :
                "#6b7280",
            score : 0
        };
    }

    let score = 0;

    const crp =
        latestBlood.values?.CRP || 0;

    const cal =
        latestCal?.value || 0;

    if(crp > 5)
    {
        score += 2;
    }

    if(crp > 15)
    {
        score += 2;
    }

    if(cal > 150)
    {
        score += 2;
    }

    if(cal > 300)
    {
        score += 2;
    }

    if(score <= 2)
    {
        return {
            level :
                "Remissie",
            color :
                "#16a34a",
            score
        };
    }

    if(score <= 5)
    {
        return {
            level :
                "Lichte activiteit",
            color :
                "#ca8a04",
            score
        };
    }

    if(score <= 8)
    {
        return {
            level :
                "Matige activiteit",
            color :
                "#ea580c",
            score
        };
    }

    return {
        level :
            "Ernstige opstoot",
        color :
            "#dc2626",
        score
    };
}

const RelationshipGraphBuilder = {

    build()
    {
        const timeline =
            HealthTimelineEngine.buildTimeline();

        const graph = [];

        timeline.forEach(event =>
        {
            graph.push({

                id :
                    event.source?.id ||
                    crypto.randomUUID(),

                type :
                    event.type,

                title :
                    event.title,

                date :
                    event.date,

                source :
                    event.source,

                links : []

            });
        });

        graph.forEach(node =>
        {
            const currentDate =
                new Date(node.date);

            node.links =
                graph
                    .filter(other =>
                    {
                        if(other.id === node.id)
                        {
                            return false;
                        }

                        const diff =
                            Math.abs(
                                currentDate -
                                new Date(other.date)
                            );

                        return diff <= 14 * 86400000;
                    })
                    .map(x => x.id);
        });

        return graph;
    },

    findFerritinRelations()
    {
        const blood =
            DatabaseService.cache
            ?.healthData
            ?.bloodResults || [];

        const relations = [];

        blood.forEach(item =>
        {
            const ferritine =
                item.values?.Ferritine;

            if(
                ferritine !== undefined &&
                ferritine < 30
            )
            {
                relations.push({

                    type : "Ferritinetekort",

                    bloodId :
                        item.id,

                    ferritine :
                        ferritine,

                    impact : [

                        "Vermoeidheid",
                        "Slaap",
                        "Concentratie",

                    ]

                });
            }
        });

        return relations;
    },

    findKnowledgeRelations(tags = [])
    {
        if(
            !window.globalIndex ||
            !Array.isArray(globalIndex)
        )
        {
            return [];
        }

        return globalIndex.filter(item =>
        {
            const itemTags =
                normalizeTags(
                    item.tags || []
                );

            return tags.some(tag =>
            {
                return itemTags.includes(
                    String(tag)
                        .toLowerCase()
                );
            });
        });
    },

    explain(node)
    {
        const explanation = [];

        if(node.type === "blood")

        if(node.type === "sleep")

            );
        }

        if(node.type === "stress")
        {
            explanation.push(
                "Stressregistratie aanwezig"
            );
        }

        if(node.links?.length)
        {
            explanation.push(
                `${node.links.length} gerelateerde gebeurtenissen`
            );
        }

        return explanation;
    },

const MentalHealthEngine = {

    calculate() {

        const health =
            DatabaseService.cache?.healthData || {};

        const sleep =
            (health.sleepEntries || []).at(-1);

        const stress =
            (health.stressEntries || []).at(-1);

        const mood =
            (health.moodEntries || []).at(-1);

        const energy =
            (health.energyEntries || []).at(-1);

        const anxiety =
            (health.anxietyEntries || []).at(-1);

        let score = 50;

        if(sleep?.hours >= 7) score += 15;
        if(sleep?.hours < 6) score -= 15;

        if(stress?.level <= 3) score += 15;
        if(stress?.level >= 7) score -= 15;

        if(mood?.score >= 7) score += 10;
        if(mood?.score <= 4) score -= 10;

        if(energy?.score >= 7) score += 10;
        if(energy?.score <= 4) score -= 10;

        if(anxiety?.score >= 7) score -= 15;

        score = Math.max(
            0,
            Math.min(score,100)
        );

        return {

            score,

            status:
                score >= 80
                    ? "Uitstekend"
                    : score >= 60
                    ? "Goed"
                    : score >= 40
                    ? "Matig"
                    : "Belast",

            recommendations:
                this.buildRecommendations(
                    score,
                    sleep,
                    stress
                )

        };

    },

    buildRecommendations(
        score,
        sleep,
        stress
    ) {

        const advice = [];

        if(sleep?.hours < 7) {

            advice.push(
                "Probeer slaapduur te verhogen."
            );

        }

        if(stress?.level > 6) {

            advice.push(
                "Stressniveau verdient aandacht."
            );

        }

        if(score < 50) {

            advice.push(
                "Bespreek aanhoudende klachten met zorgverlener."
            );

        }

        return advice;

    }

};

                0
            ) / values.length;

        const score =
            Math.round(
                average * 10
            );

        let status = "🟢 Goed";

        if(score < 80)
            status = "🟡 Redelijk";

        if(score < 60)
            status = "🟠 Belast";

        if(score < 40)
            status = "🔴 Ernstig belast";

        return {
            score,
            status
        };
    }

};

const MentalHealthIndex = {

    calculate({
        phq9 = 0,
        gad7 = 0,
        who5 = 100
    })
    {
        const phqPart =
            (phq9 / 27) * 100;

        const gadPart =
            (gad7 / 21) * 100;

        const whoPart =
            100 - who5;

        const score =
            Math.round(
                (
                    phqPart * 0.40 +
                    gadPart * 0.30 +
                    whoPart * 0.30
                )
            );

        let status =
            "🟢 Goed";

        if(score >= 25)
        {
            status =
                "🟡 Aandachtspunt";
        }

        if(score >= 50)
        {
            status =
                "🟠 Verhoogde belasting";
        }

        if(score >= 75)
        {
            status =
                "🔴 Hoge belasting";
        }

        return {

            score,

            status

        };
    }

};

const FatigueIndex = {

    calculate(data = {})
    {
        const sleep =
            Number(data.sleep || 0);

        const energy =
            Number(data.energy || 0);

        const pain =
            Number(data.abdominalPain || 0);

        

        const nightVisits =
            Number(data.nightVisits || 0);

        const workload =
            Number(data.workload || 0);

        let score = 100;

        score -=
            (10 - sleep) * 4;

        score -=
            (10 - energy) * 4;

        score -=
            pain * 2;

        score -=
            nightVisits * 3;

        score -=
            workload * 1;

        score = Math.max(
            0,
            Math.round(score)
        );

        let status =
            "🟢 Frisse reserve";

        if(score < 80)
            status =
            "🟡 Verminderde reserve";

        if(score < 60)
            status =
            "🟠 Vermoeid";

        if(score < 40)
            status =
            "🔴 Uitputtingsrisico";

        return {
            score,
            status
        };
    }

};

const CrisisMonitor = {

    evaluate(data = {})
    {
        const warnings = [];

        if(data.phq9 >= 20)
        {
            warnings.push(
                "Ernstige depressieve klachten"
            );
        }

        if(data.gad7 >= 15)
        {
            warnings.push(
                "Ernstige angstbelasting"
            );
        }

        if(data.generalWellbeing <= 2)
        {
            warnings.push(
                "Zeer laag welzijn"
            );
        }

        if(data.energy <= 2)
        {
            warnings.push(
                "Extreme vermoeidheid"
            );
        }

        return {
            level:
                warnings.length
                ? "RED"
                : "GREEN",

            warnings
        };
    }

};

function getWeekNumber(date)
{
    const d =
        new Date(date);

    d.setHours(
        0,0,0,0
    );

    d.setDate(
        d.getDate() + 4 -
        (d.getDay() || 7)
    );

    const yearStart =
        new Date(
            d.getFullYear(),
            0,
            1
        );

    return Math.ceil(
        (
            (
                d - yearStart
            ) / 86400000 + 1
        ) / 7
    );
}

    generate() {

        return {
            inflammation: this.analyzeInflammation(),
            nutrition: this.analyzeNutrition(),
            fatigue: this.analyzeFatigue(),
            mentalHealth: this.analyzeMentalHealth(),
            flareRisk: this.analyzeFlareRisk()
        };

    },

    analyzeInflammation() {

        const profile = MyIBDProfileBuilder.build();

        if(profile.inflammation) {

            return {
                score: 75,
                status: "Verhoogd",
                recommendation:
                    "Ontstekingsactiviteit lijkt verhoogd."
            };

        }

        return {
            score: 20,
            status: "Laag",
            recommendation:
                "Geen duidelijke tekenen van actieve ontsteking."
        };

    },

    analyzeNutrition() {

        const blood =
            DatabaseService.cache?.healthData?.bloodResults || [];

        if(!blood.length) {

            return {
                score: 0,
                status: "Geen data"
            };

        }

        const latest = blood[0];

        const ferritine =
            latest.values?.Ferritine || 0;

        const b12 =
            latest.values?.VitamineB12 || 0;

        let score = 100;

        if(ferritine < 50) score -= 25;
        if(b12 < 250) score -= 25;

        return {

            score,

            status:
                score > 75
                    ? "Goed"
                    : score > 50
                    ? "Opvolgen"
                    : "Risico"

        };

    },

    analyzeFatigue() {

        const profile =
            MyIBDProfileBuilder.build();

        return {

            score:
                profile.fatigueRisk
                    ? 70
                    : 20,

            status:
                profile.fatigueRisk
                    ? "Verhoogd"
                    : "Laag"

        };

    },

    analyzeMentalHealth() {

        return MentalHealthEngine.calculate();

    },

    analyzeFlareRisk() {

        const activity =
            HealthTimelineEngine.calculateDiseaseActivity();

        return {

            score: activity,

            status:
                activity > 70

    </div>
    `;

    const arrayBuffer =
        await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data: arrayBuffer
        }).promise;

    let fullText = "";

    for(
        let pageNum = 1;
        pageNum <= pdf.numPages;
        pageNum++
    )
    {
        const page =
            await pdf.getPage(
                pageNum
            );

        const content =
            await page.getTextContent();

        const pageText =
            content.items
            .map(
                item => item.str
            )
            .join(" ");

        fullText +=
            pageText + "\n";
    }

    console.log(
        "PDF TEKST:",
        fullText
    );

    extractBloodValues(
        fullText
    );
}

function extractBloodValues(
    text
)
{
    const values =
    {
        CRP :
            extractLabNumber(
                text,
                [
                    "CRP",
                    "C-reactive protein"
                ]
            ),

        Ferritine :
            extractLabNumber(
                text,
                [
                    "Ferritine",
                    "Ferritin"
                ]
            ),

        Hemoglobine :
            extractLabNumber(
                text,
                [
                    "Hemoglobine",
                    "Hemoglobin",
                    "Hb"
                ]
            ),

        VitamineD :
            extractLabNumber(
                text,
                [
                    "Vitamine D",
                    "Vitamin D"
                ]
            ),

        VitamineB12 :
    extractLabNumber(
        text,
        [
            "B12",
            "Vitamine B12"
        ]
    ),

Calprotectine :
    extractLabNumber(
        text,
        [
            "Calprotectine",
            "Fecal Calprotectin"
        ]
    ),

        Albumine :
            extractLabNumber(
                text,
                [
                    "Albumine"
                ]
            ),

        Leukocyten :
            extractLabNumber(
                text,
                [
                    "Leukocyten",
                    "WBC"
                ]
            ),

        Trombocyten :
            extractLabNumber(
                text,
                [
                    "Trombocyten",
                    "Platelets"
                ]
            )
    };

    renderBloodExtractionResult(
        values
    );
}

function extractLabNumber(
    text,
    labels
)
{
    for(const label of labels)
    {
        const regex =
new RegExp(
    label +
    "[\\s\\S]{0,60}?" +
    "([0-9]+(?:[\\.,][0-9]+)?)",
    "i"
);

        const match =
            text.match(
                regex
            );

        if(match)
        {
            return Number(
                match[1]
                .replace(",",".")
            );
        }
    }

    return null;
}

async function filterWebsites(){

    const websites =
        await loadWebsites();

    const search =

        document
            .getElementById(
                "websiteSearch"
            )
            .value
            .toLowerCase();

    const country =

        document
            .getElementById(
                "websiteCountry"
            )
            .value;

        const category =

    document
        .getElementById(
            "websiteCategory"
        )
        .value;

const subCategory =

    document
        .getElementById(
            "websiteSubCategory"
        )
        ?.value || "";

const favoritesOnly =

    document
        .getElementById(
            "favoritesOnly"
        )
        .checked;

    const filtered =

        websites.filter(site => {

            const text =

    `

        ${site.titel || ""}

        ${site.title || ""}

        ${site.land || ""}

        ${site.categorie || ""}

        ${site.subcategorie || ""}

        ${site.beschrijving || ""}

        ${

            Array.isArray(
                site.tags
            )

                ?

            site.tags.join(" ")

                :

            site.tags || ""

        }

    `

    .toLowerCase();

            const searchMatch =

    text.includes(
        search
    );

const countryMatch =

    !country ||

    site.land === country;

const categoryMatch =

    !category ||

    site.subcategorie === category ||

    site.category === category;

const subCategoryMatch =

    !subCategory ||

    site.subcategorie === subCategory;

const favoriteMatch =

    !favoritesOnly ||

    site.favorite === true;

return(

    searchMatch &&

    countryMatch &&

    categoryMatch &&

    subCategoryMatch &&

    favoriteMatch

);

        });

    renderWebsiteList(
        filtered
    );

}

function determineManagementCategory(path){

    const p = (path || "")
        .toLowerCase();

    if(p.includes("ledenbeheer")){
        return "members";
    }

    if(p.includes("projecten")){
        return "projects";
    }

    if(p.includes("vergaderingen")){
        return "meetings";
    }

    if(p.includes("kasboek")){
        return "finance";
    }

    if(p.includes("onkosten")){
        return "finance";
    }

    if(p.includes("post_verzendingen")){
        return "shipping";
    }

    if(p.includes("admin_ccv")){
        return "administration";
    }

    return "";
}

function determineManagementSubCategory(
    path
){

    const parts =
        (path || "")
        .split("/");

    const baseFolders = [

        "ledenbeheer",
        "projecten",
        "vergaderingen",
        "onkosten",
        "kasboek",
        "admin_ccv",
        "post_verzendingen"

    ];

    const matchIndex =

        parts.findIndex(

            part =>

                baseFolders.includes(
                    part.toLowerCase()
                )

        );

    if(
        matchIndex >= 0 &&

        parts.length >
        matchIndex + 1
    ){

        return parts[
            matchIndex + 1
        ];

    }

    return "Algemeen";

}

async function createCalendarEvent()
{
    try{

        const token =
            await getAccessToken();

        const body = {

            subject :
                document.getElementById(
                    "eventTitle"
                ).value,

            start : {

                dateTime :
                    document.getElementById(
                        "eventStart"
                    ).value,

                timeZone :
                    "Europe/Brussels"

            },

            end : {

                dateTime :
                    document.getElementById(
                        "eventEnd"
                    ).value,

                timeZone :
                    "Europe/Brussels"

            },

            location : {

                displayName :
                    document.getElementById(
                        "eventLocation"
                    ).value

            },

            body : {

                contentType :
                    "text",

                content :
                    document.getElementById(
                        "eventBody"
                    ).value

            }

        };

        const response =
            await fetch(
                "https://graph.microsoft.com/v1.0/me/events",
                {
                    method:"POST",

                    headers:{
                        Authorization:
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        if(response.ok){

            alert(
                "✅ Afspraak aangemaakt"
            );

            renderCalendar();

        }
        else{

            alert(
                "❌ Outlook fout"
            );

        }

    }
    catch(error){

        alert(
            error.message
        );

    }
}

    document.getElementById(

    ).innerHTML =

){

function openRelationshipItem(id)
{
    if(id.includes("_"))
    {
        const parts = id.split("_");

        openSearchResult(
            parts[0],
            parts.slice(1).join("_")
        );

        return;
    }

    const item =
        globalIndex.find(
            x =>
                String(x.id)
                ===
                String(id)
        );

    if(!item){
        return;
    }

    openSearchResult(
        item.source,
        item.id
    );
}

async function saveRelationship(
    websiteId
){

    const id =

        document
            .getElementById(
                "relationshipTarget"
            )
            .value
            .trim();

    const type =

        document
            .getElementById(
                "relationshipType"
            )
            .value;

    if(!id){

        return;

    }

    const website =

        websitesCache.find(

            w =>

                String(w.id)
                ===
                String(websiteId)

        );

    if(!website){

        return;

    }

    if(!website.relationships){

        website.relationships = [];

    }

    website.relationships.push({

        id:id,

        type:type,

        created:
            new Date()
            .toISOString()

    });

    await saveWebsites();

    renderRelationshipList(
        websiteId
    );

}

function normalizeTags(tags){

    if(!tags){
        return [];
    }

    if(Array.isArray(tags)){
        return tags
            .map(t => String(t).trim().toLowerCase())
            .filter(Boolean);
    }

    if(typeof tags === "string"){
        return tags
            .split(",")
            .map(t => t.trim().toLowerCase())
            .filter(Boolean);
    }

    return [];
}

function containsWord(
    text,
    keyword
)
{
    return new RegExp(
        "\\b" +
        keyword.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        ) +
        "\\b",
        "i"
    )
    .test(text);
}

function buildBloodTaxonomy(
    values
)
{
    const taxonomy =
    {
        mainCategory :
            "Bloedanalyse"
    };

    if(values.CRP > 5)
    {
        taxonomy.CRP = true;
        taxonomy.InflammationMarker = true;
        taxonomy.DiseaseActivity = true;
        taxonomy.FlareIndicator = true;
    }

    if(values.CRP <= 5)
    {
        taxonomy.RemissionIndicator = true;
    }

    if(values.Ferritine < 30)
    {
        taxonomy.Ferritine = true;
        taxonomy.AnemiaMarker = true;
    }

    if(values.Hemoglobine < 12)
    {
        taxonomy.Hemoglobine = true;
        taxonomy.AnemiaMarker = true;
    }

    if(values.VitamineD < 30)
    {
        taxonomy.VitamineD = true;
        taxonomy.NutritionMarker = true;
    }

    if(values.Albumine < 35)
    {
        taxonomy.Albumine = true;
        taxonomy.NutritionMarker = true;
    }

    return taxonomy;
}

function buildHealthRelationships(
    item
)
{
    const relationships = [];

    const tags =
        normalizeTags(
            item.tags
        );

    globalIndex

    .filter(
        x =>
            x.source ===
            "knowledge"
    )

    .forEach(
        knowledgeItem =>
        {
            let score = 0;

            const knowledgeTags =
                normalizeTags(
                    knowledgeItem.tags
                );

            tags.forEach(tag => {

                if(
                    knowledgeTags.includes(
                        tag
                    )
                )
                {
                    score += 5;
                }

            });

            Object.keys(
                item.taxonomy || {}
            )
            .forEach(field => {

                if(
                    item.taxonomy[field]
                    &&
                    knowledgeItem.taxonomy?.[field]
                )
                {
                    score += 10;
                }

            });

            if(score >= 10)
            {
                relationships.push({

                    id :
                        knowledgeItem.id,

                    source :
                        "knowledge",

                    type :
                        "related",

                    automatic :
                        true,

                    weight :
                        score

                });
            }

        });

    return relationships
        .sort(
            (a,b) =>
                b.weight - a.weight
        )
        .slice(0,10);
}


function buildKnowledgeKeywords(
    knowledgeItem
){

    const keywords = new Set();

    (knowledgeItem.title || "")
        .toLowerCase()
        .split(/\s+/)
        .filter(word => word.length > 3)
        .forEach(word => keywords.add(word));

    normalizeTags(
        knowledgeItem.tags
    ).forEach(
        tag => keywords.add(
            tag.toLowerCase()
        )
    );

    const taxonomy =
        knowledgeItem.taxonomy || {};

    Object.keys(taxonomy)
        .filter(
            key => taxonomy[key] === true
        )
        .forEach(
            key => keywords.add(
                key.toLowerCase()
            )
        );

    return keywords;

}

        document.getElementById(
            "mapLibraryFilter"
        )?.value || "all";

        )?.value || "all";

        document.getElementById(

        )?.checked;

        document.getElementById(
            "relatedOnly"
        )?.checked;

    const maxNodes =
        parseInt(
            document.getElementById(
                "mapNodeLimit"
            )?.value || 250
        );

    let items = [...globalIndex];

    if(sourceFilter !== "all"){

        items = items.filter(
            item =>
                item.source ===
                sourceFilter
        );

    }

    if(libraryFilter !== "all"){

        items = items.filter(
            item =>
                item.libraryType ===
                libraryFilter
        );

    }

    if(categoryFilter !== "all"){

        items = items.filter(
            item =>
                item.category ===
                categoryFilter
                ||
                item.mainCategory ===
                categoryFilter
        );

    }

    if(linkedOnly){

        items = items.filter(
            item =>
                item.oneDriveId
        );

    }

    if(relatedOnly){

        items = items.filter(
            item =>
                item.relationships &&
                item.relationships.length > 0
        );

    }

    items.sort((a,b)=>{

    const weight = {

        knowledge:1,
        folder:2,
        file:3,
        website:4

    };

    return (

async function askAssociationAI(
    associationName,
    question
)
{
    const context =
        getAssociationContext(
            associationName,
            question
        );

    /* ----------------------------------
       Documentinhoud laden
       ---------------------------------- */

    for(const result of context)
    {
        const item = result.item;

        if(
            item &&
            item.source === "file"
        )
        {
            await ensureDocumentContent(
                item
            );
        }
    }

    /* ----------------------------------
       Ranking uitvoeren
       ---------------------------------- */

    const ranked =
        rankKnowledgeResults(
            question,
            context.map(
                x => x.item
            )
        );

    /* ----------------------------------
       Samenvatting
       ---------------------------------- */

    const summary =
        buildAISummary(
            question,
            ranked
        );

    /* ----------------------------------
       Resultaat tonen
       ---------------------------------- */

    renderAssociationAIAnswer(
        associationName,
        question,
        summary,
        ranked
    );
}

function calculateAIMaturity()
{
    const result =
    {
        score : 0,
        level : "Starter",
        completed : [],
        missing : []
    };

    const index =
        Array.isArray(globalIndex)
        ? globalIndex
        : [];

    const bloodCount =
        index.filter(
            x => x.source === "blood"
        ).length;

    const stoolCount =
        index.filter(
            x => x.source === "stool"
        ).length;

    const calprotectineCount =
        index.filter(
            x => x.source === "calprotectine"
        ).length;

    const medicationCount =
        index.filter(
            x => x.source === "medication"
        ).length;

    const sleepCount =
        index.filter(
            x => x.source === "sleep"
        ).length;

    const stressCount =
        index.filter(
            x => x.source === "stress"
        ).length;

    const mealCount =
        index.filter(
            x => x.source === "meal"
        ).length;

    const examCount =
        index.filter(
            x => x.source === "exam"
        ).length;

    const healthDocuments =
        index.filter(
            x =>
                x.source === "file" &&
                x.aiClassification === "health"
        ).length;

    let score = 0;

    if (bloodCount > 0)
    {
        score += 10;
        result.completed.push("Bloedwaarden");
    }
    else
    {
        result.missing.push("Bloedwaarden");
    }

    if (stoolCount > 0)
    {
        score += 15;
        result.completed.push("Stoelgang");
    }
    else
    {
        result.missing.push("Stoelgang");
    }

    if (calprotectineCount > 0)
    {
        score += 15;
        result.completed.push("Calprotectine");
    }
    else
    {
        result.missing.push("Calprotectine");
    }

    if (medicationCount > 0)
    {
        score += 10;
        result.completed.push("Medicatie");
    }
    else
    {
        result.missing.push("Medicatie");
    }

    if (sleepCount > 0)
    {
        score += 10;
        result.completed.push("Slaap");
    }
    else
    {
        result.missing.push("Slaap");
    }

    if (stressCount > 0)
    {
        score += 10;
        result.completed.push("Stress");
    }
    else
    {
        result.missing.push("Stress");
    }

    if (mealCount > 0)
    {
        score += 10;
        result.completed.push("Voeding");
    }
    else
    {
        result.missing.push("Voeding");
    }

    if (examCount > 0)
    {
        score += 10;
        result.completed.push("Onderzoeken");
    }
    else
    {
        result.missing.push("Onderzoeken");
    }

    if (healthDocuments > 0)
    {
        score += 10;
        result.completed.push("Gezondheidsdocumenten");
    }
    else
    {
        result.missing.push("Gezondheidsdocumenten");
    }

    result.score = score;

    if(score < 30)
    {
        result.level = "Starter";
    }
    else if(score < 60)
    {
        result.level = "Basis";
    }
    else if(score < 80)
    {
        result.level = "Gevorderd";
    }
    else
    {
        result.level = "Expert";
    }

    return result;
}

function drawIBDTrendChart()
{
    const canvas =
        document.getElementById(
            "ibdTrendChart"
        );

    if(!canvas)
    {
        return;
    }

    const ctx =
        canvas.getContext("2d");

    const entries =
        globalIndex
        .filter(
            x =>
                x.source === "blood"
        )
        .sort(
            (a,b) =>
                new Date(
                    a.testDate || 0
                )
                -
                new Date(
                    b.testDate || 0
                )
        );

    if(entries.length < 2)
    {
        ctx.fillText(
            "Minstens 2 bloedanalyses nodig",
            20,
            40
        );

        return;
    }

    const crpValues =
        entries.map(
            x =>
                Number(
                    x.values?.CRP || 0
                )
        );

    const ferritineValues =
        entries.map(
            x =>
                Number(
                    x.values?.Ferritine || 0
                )
        );

    const width =
        canvas.width =
        canvas.offsetWidth;

    const height =
        canvas.height =
        300;

    const maxValue =
        Math.max(
            ...crpValues,
            ...ferritineValues,
            10
        );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.strokeStyle =
        "#e5e7eb";

    for(
        let i=0;
        i<5;
        i++
    )
    {
        const y =
            (height / 5) * i;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }

    function drawLine(
        values,
        color
    )
    {
        ctx.beginPath();

        ctx.strokeStyle =
            color;

        ctx.lineWidth = 3;

        values.forEach(
            (value,index)=>
            {
                const x =
                    (
                        index /
                        (
                            values.length - 1
                        )
                    ) * width;

                const y =
                    height -
                    (
                        value /
                        maxValue
                    ) * (
                        height - 20
                    );

                if(index===0)
                {
                    ctx.moveTo(
                        x,
                        y
                    );
                }
                else
                {
                    ctx.lineTo(
                        x,
                        y
                    );
                }
            }
        );

        ctx.stroke();
    }

    drawLine(
        crpValues,
        "#dc2626"
    );

    drawLine(
        ferritineValues,
        "#2563eb"
    );

    ctx.fillStyle =
        "#dc2626";

    ctx.fillRect(
        10,
        10,
        15,
        15
    );

    ctx.fillStyle =
        "#111";

    ctx.fillText(
        "CRP",
        35,
        22
    );

    ctx.fillStyle =
        "#2563eb";

    ctx.fillRect(
        90,
        10,
        15,
        15
    );

    ctx.fillStyle =
        "#111";

    ctx.fillText(
        "Ferritine",
        115,
        22
    );
}

function renderRecentDocuments()
{
    window.activeDocumentMonth =
        window.activeDocumentMonth ||
        "all";

    const newFiles =
        globalIndex
        .filter(
            x =>
                x.source === "file"
        )
        .sort(
            (a,b) =>
                new Date(
                    b.lastModifiedDateTime || 0
                )
                -
                new Date(
                    a.lastModifiedDateTime || 0
                )
        );

    const availableMonths =
    [
        ...new Set(
            newFiles.map(
                file =>
                    (
                        file.lastModifiedDateTime ||
                        file.modified ||
                        ""
                    ).substring(0,7)
            )
        )
    ]
    .filter(Boolean)
    .sort()
    .reverse();

    const monthCounts = {};

newFiles.forEach(file => {

    const monthKey =
        (
            file.lastModifiedDateTime ||
            file.modified ||
            ""
        ).substring(0,7);

    if(!monthKey)
    {
        return;
    }

    monthCounts[monthKey] =
        (monthCounts[monthKey] || 0) + 1;

});

    function formatMonthLabel(
    monthKey
)
{
    const months = {
        "01":"Januari",
        "02":"Februari",
        "03":"Maart",
        "04":"April",
        "05":"Mei",
        "06":"Juni",
        "07":"Juli",
        "08":"Augustus",
        "09":"September",
        "10":"Oktober",
        "11":"November",
        "12":"December"
    };

    const parts =
        monthKey.split("-");

    if(parts.length !== 2)
    {
        return monthKey;
    }

    return (
        months[parts[1]]
        || parts[1]
    )
    + " " +
    parts[0];
}

    const visibleFiles =

    window.activeDocumentMonth ===
    "all"

    newFiles

                window.activeDocumentMonth

    );
